<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>seagull communication</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235e6ad2'/%3E%3Cpath d='M7 19c2-2.2 4-3 6-2s3.2 3 5.2 3 3.8-1.2 5.2-3' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;--panel:#0e0e10;--panel-2:#161618;--panel-3:#1d1d20;
  --border:#232326;--border-soft:#1a1a1d;
  --text:#ededef;--text-dim:#8b8b92;--text-faint:#5c5c63;
  --accent:#5e6ad2;--accent-hover:#6b76dd;--accent-soft:rgba(94,106,210,.14);
  --green:#3dd68c;--red:#f2555a;--orange:#f2994a;
  --r:8px;
}
[data-theme="light"]{
  --bg:#ffffff;--panel:#fafafa;--panel-2:#f4f4f5;--panel-3:#ebebee;
  --border:#e4e4e7;--border-soft:#ededf0;
  --text:#18181b;--text-dim:#71717a;--text-faint:#a1a1aa;
  --accent:#5e6ad2;--accent-hover:#4f5bc2;--accent-soft:rgba(94,106,210,.09);
  --green:#16a34a;--red:#dc2626;--orange:#d97706;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);
  overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--panel-3);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{display:flex;height:100vh;height:100dvh}

/* ============ 侧栏 ============ */
.sidebar{width:280px;flex:0 0 280px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border-soft);min-height:0}
.side-head{display:flex;align-items:center;gap:8px;padding:14px 12px 10px}
.logo{width:24px;height:24px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.logo svg{width:14px;height:14px}
.brand{font-size:13.5px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-size:10.5px;font-weight:400;color:var(--text-faint);letter-spacing:0;margin-top:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:6px;padding:5px 9px;font-size:12.5px;transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn svg{width:13px;height:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.search{padding:0 10px 8px}
.search input{width:100%;background:var(--panel-2);border:1px solid transparent;border-radius:7px;padding:7px 10px;font-size:13px;color:var(--text);outline:none;transition:border-color .12s,background .12s}
.search input::placeholder{color:var(--text-faint)}
.search input:focus{background:var(--panel-3);border-color:var(--border)}

.list{flex:1;overflow-y:auto;padding:2px 6px 8px;min-height:0}
.contact{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;position:relative;transition:background .1s}
.contact:hover{background:var(--panel-2)}
.contact.active{background:var(--panel-2)}
.contact.active::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:15px;border-radius:2px;background:var(--accent)}
.contact.pending{opacity:.65}

.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--panel-3);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--text-dim);position:relative;overflow:visible}
.avatar .pres{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--text-faint);border:2px solid var(--panel)}
.avatar .pres.on{background:var(--green)}
.avatar .pres.wait{background:var(--orange)}

.c-main{flex:1;min-width:0}
.c-top{display:flex;align-items:baseline;gap:6px}
.c-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;letter-spacing:-.005em}
.c-time{font-size:10.5px;color:var(--text-faint);flex:0 0 auto}
.c-bottom{display:flex;align-items:center;gap:6px;margin-top:2px}
.c-prev{font-size:12px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.c-badge{min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;flex:0 0 auto}

.empty-list{padding:36px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;line-height:1.8}
.empty-list svg{width:30px;height:30px;margin-bottom:12px;opacity:.4}

.side-foot{padding:8px;border-top:1px solid var(--border-soft)}
.me{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background .1s}
.me:hover{background:var(--panel-2)}
.me-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-code{font-size:10.5px;color:var(--text-faint);font-family:ui-monospace,Menlo,monospace;margin-top:1px;letter-spacing:.4px}

/* ============ 主区 ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat-head{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border-soft)}
.chat-head .back{display:none}
.chat-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;display:flex;align-items:center;gap:5px}
.chat-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:0 0 auto}
.chat-sub .dot.on{background:var(--green)}
.chat-actions{margin-left:auto;display:flex;gap:4px}

.icon-btn{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:background .12s,color .12s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn svg{width:15px;height:15px}

.messages{flex:1;overflow-y:auto;padding:18px 16px 6px;display:flex;flex-direction:column;min-height:0}
.messages::-webkit-scrollbar-thumb{background:transparent}
.messages:hover::-webkit-scrollbar-thumb{background:var(--border);background-clip:padding-box}

.day{align-self:center;font-size:11px;color:var(--text-faint);padding:12px 0 8px;position:sticky;top:0}
.sys{align-self:center;font-size:11.5px;color:var(--text-faint);padding:4px 10px;margin:6px 0;background:var(--panel-2);border-radius:20px}

.msg{display:flex;flex-direction:column;max-width:min(72%,560px);margin-bottom:2px}
.msg.in{align-self:flex-start;align-items:flex-start}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg.gap{margin-top:10px}
.bubble{padding:7px 11px;border-radius:12px;font-size:13.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.msg.in .bubble{background:var(--panel-2);color:var(--text);border-bottom-left-radius:4px}
.msg.out .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bubble.recalled{font-style:italic;opacity:.55}
.meta{font-size:10.5px;color:var(--text-faint);margin-top:3px;padding:0 3px;display:flex;align-items:center;gap:5px}
.meta svg{width:11px;height:11px;opacity:.8}

.bubble.img{padding:3px;background:var(--panel-2)!important;border:1px solid var(--border-soft);line-height:0}
.bubble.img img{max-width:280px;max-height:280px;border-radius:9px;display:block;cursor:zoom-in}
.bubble.file{display:flex;align-items:center;gap:10px;min-width:180px;cursor:pointer}
.msg.out .bubble.file{background:var(--accent)}
.f-ico{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.f-ico svg{width:15px;height:15px}
.f-name{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.f-size{font-size:10.5px;opacity:.75;margin-top:1px}

.empty-chat{margin:auto;text-align:center;color:var(--text-faint);font-size:12.5px;line-height:1.9;max-width:260px}
.empty-chat .big{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty-chat .big svg{width:22px;height:22px;color:var(--text-faint)}
.empty-chat b{display:block;color:var(--text-dim);font-weight:500;font-size:13.5px;margin-bottom:4px}

.composer{padding:10px 14px 14px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--border-soft);background:var(--bg)}
.composer .attach{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex:0 0 auto;transition:background .12s,color .12s}
.composer .attach:hover:not(:disabled){background:var(--panel-2);color:var(--text)}
.composer .attach:disabled{opacity:.35;cursor:not-allowed}
.composer .attach svg{width:16px;height:16px}
.composer input{flex:1;min-width:0;background:var(--panel-2);border:1px solid transparent;border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--text);outline:none;transition:border-color .12s,background .12s}
.composer input::placeholder{color:var(--text-faint)}
.composer input:focus{background:var(--panel-3);border-color:var(--border)}
.composer input:disabled{opacity:.5}
.send{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .12s,opacity .12s}
.send:hover:not(:disabled){background:var(--accent-hover)}
.send:disabled{opacity:.3;cursor:not-allowed}
.send svg{width:15px;height:15px}

/* ============ 弹窗 ============ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.overlay.show{display:flex;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:pop .16s cubic-bezier(.2,1.1,.5,1);margin:auto}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.dialog h3{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:5px}
.dialog .sub{font-size:12.5px;color:var(--text-dim);line-height:1.65;margin-bottom:16px}
.dialog label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
.dialog input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--text);outline:none;transition:border-color .12s}
.dialog input[type=text]:focus{border-color:var(--accent)}
.dialog input[type=text]::placeholder{color:var(--text-faint)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.code-box{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:16px;text-align:center;margin-bottom:18px}
.code-label{font-size:11.5px;color:var(--text-faint);margin-bottom:8px}
.code-value{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:600;letter-spacing:3px;color:var(--text);cursor:pointer;transition:color .12s}
.code-value:hover{color:var(--accent)}
.code-tip{font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.6}
.code-actions{display:flex;gap:6px;justify-content:center;margin-top:12px}

.or{display:flex;align-items:center;gap:10px;margin:0 0 16px;color:var(--text-faint);font-size:11.5px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border-soft)}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.set-row:last-of-type{border-bottom:none}
.set-label{font-size:13px}
.set-hint{font-size:11px;color:var(--text-faint);margin-top:2px;line-height:1.5}
.set-select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:inherit;outline:none;cursor:pointer}
.set-input{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12.5px;color:var(--text);outline:none;width:130px;text-align:right}
.set-input:focus{border-color:var(--accent)}

.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;z-index:400}
.toast{background:var(--panel-3);border:1px solid var(--border);color:var(--text);padding:8px 15px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .18s ease;transition:opacity .25s,transform .25s;max-width:84vw;text-align:center}
.toast.out{opacity:0;transform:translateY(6px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:24px;z-index:300;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* ============ 响应式 ============ */
@media (max-width:720px){
  .sidebar{width:100%;flex:0 0 100%;border-right:none}
  .main{display:none}
  body.chatting .main{display:flex}
  body.chatting .sidebar{display:none}
  .chat-head .back{display:flex}
  .msg{max-width:86%}
}
</style>
</head>
<body>

<div class="app">
  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar">
    <div class="side-head">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 14c1.6-1.7 3.2-2.4 4.8-2 2 .5 3.2 2.4 5 3 1.8.6 3.6 0 5.2-1.6"/>
        </svg>
      </div>
      <div class="brand">海鸥<small>端到端加密</small></div>
      <button class="btn primary" id="btnPair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        配对
      </button>
    </div>

    <div class="search">
      <input id="searchInput" type="text" placeholder="搜索" autocomplete="off">
    </div>

    <div class="list" id="contactList"></div>

    <div class="side-foot">
      <div class="me" id="meRow">
        <div class="avatar" id="meAvatar">我</div>
        <div style="flex:1;min-width:0">
          <div class="me-name" id="meName">未设置昵称</div>
          <div class="me-code" id="meCode">···</div>
        </div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-faint);flex:0 0 auto"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>
  </aside>

  <!-- ============ 聊天区 ============ -->
  <main class="main">
    <header class="chat-head" id="chatHead"></header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <button class="attach" id="btnAttach" disabled title="发送文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input id="msgInput" type="text" placeholder="输入消息…" disabled autocomplete="off">
      <button class="send" id="btnSend" disabled title="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </main>
</div>

<input type="file" id="fileInput" style="display:none">
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toasts" id="toasts"></div>

<!-- ============ 配对弹窗 ============ -->
<div class="overlay" id="pairOverlay">
  <div class="dialog">
    <h3>配对</h3>
    <p class="sub">把你的 9 位邀请码发给对方，或输入对方的邀请码完成配对。</p>

    <div class="code-box">
      <div class="code-label">我的邀请码</div>
      <div class="code-value" id="myCodeVal" title="点击复制">···</div>
      <div class="code-tip" id="netState">正在连接…</div>
      <div class="code-actions">
        <button class="btn" id="btnCopyCode">复制</button>
        <button class="btn ghost" id="btnRegen">重新生成</button>
      </div>
    </div>

    <div class="or">输入对方的邀请码</div>
    <input id="peerCodeInput" type="text" maxlength="11" placeholder="ABC-DEF-GHJ" autocomplete="off" spellcheck="false">

    <div class="actions">
      <button class="btn ghost" id="btnPairCancel">取消</button>
      <button class="btn primary" id="btnPairConfirm">配对</button>
    </div>
  </div>
</div>

<!-- ============ 设置弹窗 ============ -->
<div class="overlay" id="setOverlay">
  <div class="dialog">
    <h3>设置</h3>
    <div class="set-row">
      <div><div class="set-label">主题</div></div>
      <select class="set-select" id="setTheme">
        <option value="dark">深色</option>
        <option value="light">浅色</option>
      </select>
    </div>
    <div class="set-row">
      <div>
        <div class="set-label">我的昵称</div>
        <div class="set-hint">对方会看到这个名称</div>
      </div>
      <input class="set-input" id="setName" type="text" placeholder="未设置" maxlength="16">
    </div>
    <div class="set-row">
      <div>
        <div class="set-label">我的邀请码</div>
        <div class="set-hint" id="setCodeHint">···</div>
      </div>
      <button class="btn ghost" id="btnRegen2">重新生成</button>
    </div>
    <div class="set-row">
      <div>
        <div class="set-label">密钥指纹</div>
        <div class="set-hint" id="setFp" style="font-family:ui-monospace,Menlo,monospace">···</div>
      </div>
    </div>
    <div class="set-row">
      <div>
        <div class="set-label">数据</div>
        <div class="set-hint">清空所有本地数据并重置</div>
      </div>
      <button class="btn ghost" id="btnReset" style="color:var(--red)">重置</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnSetClose">关闭</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ==========================================================
   工具
   ========================================================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,10);
const now = () => Date.now();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad2 = n => String(n).padStart(2,'0');
const fmtTime = ts => { const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const fmtSize = b => {
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(2) + ' MB';
};
const truncate = (s,n) => { s = String(s||''); return s.length > n ? s.slice(0,n)+'…' : s; };
const b64 = buf => {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = '';
  const CH = 0x8000;
  for (let i=0;i<bytes.length;i+=CH) s += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
};
const unb64 = str => {
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
};

/* ==========================================================
   邀请码
   ========================================================== */
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 去掉 I O 0 1
const CODE_LEN = 9;

function genCode(){
  const buf = new Uint8Array(CODE_LEN);
  crypto.getRandomValues(buf);
  let s = '';
  for (let i=0;i<CODE_LEN;i++) s += ALPHABET[buf[i] % ALPHABET.length];
  return s;
}
function fmtCode(c){ return String(c||'').replace(/(.{3})(?=.)/g,'$1-'); }
function normCode(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,CODE_LEN); }

/* ==========================================================
   存储
   ========================================================== */
const LS = {
  me:       'seagull.me.v1',
  contacts: 'seagull.contacts.v1',
  settings: 'seagull.settings.v1',
  identity: 'seagull.identity.v1',
  active:   'seagull.active.v1'
};

let me = null;
let contacts = [];
let activeCode = null;
let settings = { theme:'dark', name:'' };

function loadMe(){
  try {
    const raw = localStorage.getItem(LS.me);
    if (raw) { const d = JSON.parse(raw); if (d && d.code) return d; }
  } catch(e){}
  const d = { id: uid()+uid(), code: genCode(), name: '' };
  try { localStorage.setItem(LS.me, JSON.stringify(d)); } catch(e){}
  return d;
}
function saveMe(){
  try { localStorage.setItem(LS.me, JSON.stringify(me)); } catch(e){}
}
function loadContacts(){
  try {
    const raw = localStorage.getItem(LS.contacts);
    if (raw) contacts = JSON.parse(raw) || [];
  } catch(e){ contacts = []; }
  if (!Array.isArray(contacts)) contacts = [];
  contacts.forEach(c => {
    c.msgs = c.msgs || [];
    c.online = false;
    c.pending = !!c.pending;
    if (!c.createdAt) c.createdAt = now();
  });
}
function saveContacts(){
  try { localStorage.setItem(LS.contacts, JSON.stringify(contacts)); } catch(e){}
}
function loadSettings(){
  try {
    const raw = localStorage.getItem(LS.settings);
    if (raw) settings = Object.assign(settings, JSON.parse(raw));
  } catch(e){}
}
function saveSettings(){
  try { localStorage.setItem(LS.settings, JSON.stringify(settings)); } catch(e){}
}

/* ==========================================================
   身份 / 加密（ECDH P-256 + AES-GCM）
   ========================================================== */
let identity = null;
const keyCache = new Map();
const cryptoOk = typeof crypto !== 'undefined' && crypto.subtle && crypto.getRandomValues;

async function fingerprint(pubKey){
  const raw = await crypto.subtle.exportKey('raw', pubKey);
  const hash = await crypto.subtle.digest('SHA-256', raw);
  return [...new Uint8Array(hash).slice(0,8)]
    .map(x => x.toString(16).padStart(2,'0')).join('').toUpperCase();
}

async function initIdentity(){
  if (!cryptoOk) return null;
  try {
    const raw = localStorage.getItem(LS.identity);
    if (raw) {
      const d = JSON.parse(raw);
      const privKey = await crypto.subtle.importKey('jwk', d.priv, {name:'ECDH',namedCurve:'P-256'}, false, ['deriveKey','deriveBits']);
      const pubKey  = await crypto.subtle.importKey('jwk', d.pub,  {name:'ECDH',namedCurve:'P-256'}, true,  []);
      identity = { privKey, pubKey, pubJwk: d.pub, fp: d.fp };
      return identity;
    }
    const kp = await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'}, true, ['deriveKey','deriveBits']);
    const pubJwk  = await crypto.subtle.exportKey('jwk', kp.publicKey);
    const privJwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
    const fp = await fingerprint(kp.publicKey);
    identity = { privKey: kp.privateKey, pubKey: kp.publicKey, pubJwk, fp };
    localStorage.setItem(LS.identity, JSON.stringify({ pub: pubJwk, priv: privJwk, fp }));
    return identity;
  } catch(e){
    console.warn('identity init failed', e);
    return null;
  }
}

async function getKeyFor(contact){
  if (!identity || !contact || !contact.pubJwk) return null;
  const k = contact.code;
  if (keyCache.has(k)) return keyCache.get(k);
  const p = (async () => {
    try {
      const pub = await crypto.subtle.importKey('jwk', contact.pubJwk, {name:'ECDH',namedCurve:'P-256'}, false, []);
      return await crypto.subtle.deriveKey(
        {name:'ECDH', public: pub}, identity.privKey,
        {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
      );
    } catch(e){
      keyCache.delete(k);
      return null;
    }
  })();
  keyCache.set(k, p);
  return p;
}
function forgetKey(code){ keyCache.delete(code); }

async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}
async function decryptJSON(key, ivB64, ctB64){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(ivB64)}, key, unb64(ctB64));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ==========================================================
   网络：MQTT 主题（邀请码即房间）
   ========================================================== */
const TOPIC_PREFIX = 'seagull-lab/v1/';
const topicFor = code => TOPIC_PREFIX + String(code).toUpperCase();

const Net = { client: null, ready: false, subscribed: null };
const outbox = [];

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load fail'));
    document.head.appendChild(s);
  });
}

async function ensureMqttLib(){
  if (window.mqtt) return true;
  const urls = [
    'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js',
    'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js'
  ];
  for (const u of urls){
    try { await loadScript(u); if (window.mqtt) return true; } catch(e){}
  }
  return false;
}

function setNetState(state){
  const el = $('#netState');
  if (!el) return;
  if (state === 'on'){ el.textContent = '已连接 · 可以配对了'; el.style.color = 'var(--green)'; }
  else if (state === 'wait'){ el.textContent = '正在重连…'; el.style.color = 'var(--orange)'; }
  else { el.textContent = '未连接'; el.style.color = 'var(--text-faint)'; }
}

async function connectNet(){
  const ok = await ensureMqttLib();
  if (!ok){ setNetState('off'); toast('无法加载网络组件'); return; }

  const clientId = 'sg-' + me.id.slice(0,8) + '-' + uid().slice(0,6);
  let client;
  try {
    client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId, clean: true, reconnectPeriod: 4000,
      connectTimeout: 15000, keepalive: 60, protocolVersion: 4
    });
  } catch(e){ setNetState('off'); return; }

  Net.client = client;

  client.on('connect', () => {
    Net.ready = true;
    setNetState('on');
    subscribeMine();
    flushOutbox();
    // 对未完成的配对重发 hello
    contacts.filter(c => c.pending).forEach(c => sendHello(c));
  });
  client.on('reconnect', () => setNetState('wait'));
  client.on('close', () => { Net.ready = false; setNetState('off'); });
  client.on('error', () => { Net.ready = false; });
  client.on('message', (topic, payload) => {
    try { handleIncoming(JSON.parse(payload.toString())); } catch(e){}
  });
}

function subscribeMine(){
  if (!Net.client || !Net.ready) return;
  const t = topicFor(me.code);
  if (Net.subscribed === t) return;
  if (Net.subscribed){
    try { Net.client.unsubscribe(Net.subscribed); } catch(e){}
  }
  Net.client.subscribe(t, {qos:0}, err => { if (!err) Net.subscribed = t; });
}

function publish(topic, obj){
  const payload = JSON.stringify(obj);
  if (Net.client && Net.ready){
    try { Net.client.publish(topic, payload, {qos:0}); return true; } catch(e){}
  }
  if (outbox.length < 40) outbox.push({ topic, payload });
  return false;
}
function flushOutbox(){
  if (!Net.client || !Net.ready) return;
  while (outbox.length){
    const it = outbox.shift();
    try { Net.client.publish(it.topic, it.payload, {qos:0}); } catch(e){ break; }
  }
}

/* ==========================================================
   协议
   ========================================================== */
function profile(){
  return {
    code: me.code,
    id: me.id,
    name: me.name || '',
    pub: identity ? identity.pubJwk : null
  };
}

function sendHello(contact){
  publish(topicFor(contact.code), {
    t: 'hello',
    from: profile(),
    ts: now()
  });
}

let helloRetryTimer = null;
function startHelloRetry(){
  if (helloRetryTimer) return;
  helloRetryTimer = setInterval(() => {
    const pend = contacts.filter(c => c.pending);
    if (!pend.length) return;
    pend.forEach(c => { if (Net.ready) sendHello(c); });
  }, 8000);
}

/* ==========================================================
   收消息处理
   ========================================================== */
function findContact(code){
  return contacts.find(c => c.code === code) || null;
}

function applyProfile(contact, from){
  let changed = false;
  if (from.pub && JSON.stringify(contact.pubJwk) !== JSON.stringify(from.pub)){
    contact.pubJwk = from.pub;
    forgetKey(contact.code);
    changed = true;
  }
  if (from.name && contact.name !== from.name){
    contact.name = from.name;
    changed = true;
  }
  if (from.id && contact.peerId !== from.id){
    contact.peerId = from.id;
  }
  contact.lastSeen = now();
  contact.online = true;
  return changed;
}

async function handleIncoming(msg){
  if (!msg || !msg.from || !msg.from.code) return;
  if (msg.from.code === me.code) return;
  if (typeof msg.ts === 'number' && Math.abs(now() - msg.ts) > 3600000) return;

  switch (msg.t){
    case 'hello':     return onHello(msg);
    case 'hello-ack': return onHelloAck(msg);
    case 'msg':       return onMessage(msg);
    case 'read':      return onRead(msg);
    case 'typing':    return onTyping(msg);
    case 'recall':    return onRecall(msg);
  }
}

async function onHello(msg){
  let c = findContact(msg.from.code);
  if (!c){
    c = {
      code: msg.from.code,
      peerId: msg.from.id || null,
      name: msg.from.name || '',
      pubJwk: msg.from.pub || null,
      msgs: [],
      lastSeen: now(),
      online: true,
      pending: false,
      unread: 0,
      createdAt: now()
    };
    contacts.unshift(c);
  } else {
    applyProfile(c, msg.from);
    c.pending = false;
  }
  // 回执，附带自己的公钥
  publish(topicFor(c.code), {
    t: 'hello-ack',
    from: profile(),
    ts: now()
  });
  saveContacts();
  renderContacts();
  if (activeCode === c.code) renderChat();
}

function onHelloAck(msg){
  const c = findContact(msg.from.code);
  if (!c) return;
  applyProfile(c, msg.from);
  c.pending = false;
  saveContacts();
  renderContacts();
  if (activeCode === c.code) renderChat();
  toast('已连接：' + (c.name || fmtCode(c.code)));
}

async function onMessage(msg){
  const c = findContact(msg.from.code);
  if (!c){
    // 未知发送者：按配对请求处理
    return onHello(msg);
  }
  if (msg.from.pub && !c.pubJwk) applyProfile(c, msg.from);
  c.lastSeen = now();
  c.online = true;

  const key = await getKeyFor(c);
  if (!key) return;

  let payload;
  try { payload = await decryptJSON(key, msg.iv, msg.ct); }
  catch(e){ return; }

  const m = {
    dir: 'in',
    msgId: msg.msgId || uid(),
    type: payload.type || 'text',
    text: payload.text || '',
    fileName: payload.fileName || null,
    mime: payload.mime || null,
    size: payload.size || 0,
    data: payload.data || null,
    ts: now(),
    read: false
  };
  c.msgs.push(m);
  saveContacts();

  if (activeCode === c.code){
    m.read = true;
    publish(topicFor(c.code), { t:'read', from: profile(), msgIds:[m.msgId], ts: now() });
    renderChat();
  } else {
    c.unread = (c.unread || 0) + 1;
  }
  renderContacts();
}

function onRead(msg){
  const c = findContact(msg.from.code);
  if (!c || !Array.isArray(msg.msgIds)) return;
  msg.msgIds.forEach(id => {
    const m = c.msgs.find(x => x.msgId === id);
    if (m) m.read = true;
  });
  saveContacts();
  if (activeCode === c.code) renderChat();
}

function onTyping(msg){
  const c = findContact(msg.from.code);
  if (!c) return;
  c.lastSeen = now();
  c.online = true;
  c.typingUntil = now() + 3500;
  if (activeCode === c.code){
    renderChatHeader();
    setTimeout(() => {
      if (c.typingUntil && c.typingUntil <= now()){
        c.typingUntil = 0;
        if (activeCode === c.code) renderChatHeader();
      }
    }, 3600);
  }
}

function onRecall(msg){
  const c = findContact(msg.from.code);
  if (!c || !msg.msgId) return;
  const m = c.msgs.find(x => x.msgId === msg.msgId);
  if (!m) return;
  m.recalled = true;
  m.text = '';
  m.data = null;
  saveContacts();
  if (activeCode === c.code) renderChat();
  renderContacts();
}

/* ==========================================================
   发送
   ========================================================== */
async function sendMessage(){
  const c = getActive();
  const input = $('#msgInput');
  if (!c || !input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  await sendPayload(c, { type:'text', text });
}

async function sendPayload(contact, payload){
  const key = await getKeyFor(contact);
  if (!key){ toast('等待对方公钥，暂时无法加密发送'); return; }

  const msgId = uid();
  const m = {
    dir: 'out',
    msgId,
    type: payload.type,
    text: payload.text || '',
    fileName: payload.fileName || null,
    mime: payload.mime || null,
    size: payload.size || 0,
    data: payload.data || null,
    ts: now(),
    read: false
  };
  contact.msgs.push(m);
  saveContacts();
  renderContacts();
  if (activeCode === contact.code) renderChat();

  let enc;
  try { enc = await encryptJSON(key, payload); }
  catch(e){ toast('加密失败'); return; }

  publish(topicFor(contact.code), {
    t: 'msg',
    from: profile(),
    msgId,
    iv: enc.iv,
    ct: enc.ct,
    ts: now()
  });
}

/* ==========================================================
   渲染
   ========================================================== */
function getActive(){
  if (!activeCode) return null;
  return contacts.find(c => c.code === activeCode) || null;
}

function displayName(c){
  return (c.name && c.name.trim()) ? c.name : fmtCode(c.code);
}

function previewText(m){
  if (!m) return '';
  if (m.recalled) return '消息已撤回';
  const pre = m.dir === 'out' ? '我：' : '';
  if (m.type === 'image') return pre + '[图片]';
  if (m.type === 'file') return pre + '[文件] ' + truncate(m.fileName || '', 18);
  return pre + truncate(m.text || '', 30);
}

function lastTs(c){
  return c.msgs.length ? c.msgs[c.msgs.length-1].ts : c.createdAt;
}

function renderContacts(){
  const box = $('#contactList');
  const kw = ($('#searchInput').value || '').trim().toLowerCase();

  let list = contacts.slice();
  if (kw) {
    list = list.filter(c =>
      displayName(c).toLowerCase().includes(kw) ||
      c.code.toLowerCase().includes(kw)
    );
  }
  list.sort((a,b) => lastTs(b) - lastTs(a));

  if (!list.length){
    box.innerHTML = `
      <div class="empty-list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        ${contacts.length ? '没有匹配的联系人' : '还没有联系人<br>点击右上角「配对」开始'}
      </div>`;
    return;
  }

  box.innerHTML = list.map(c => {
    const last = c.msgs[c.msgs.length-1];
    const unread = c.unread || 0;
    const initial = esc(displayName(c).trim().charAt(0).toUpperCase() || '?');
    let presCls = '';
    if (c.pending) presCls = 'wait';
    else if (c.online) presCls = 'on';
    return `
      <div class="contact${c.code === activeCode ? ' active' : ''}${c.pending ? ' pending' : ''}" data-code="${esc(c.code)}">
        <div class="avatar">${initial}<i class="pres ${presCls}"></i></div>
        <div class="c-main">
          <div class="c-top">
            <div class="c-name">${esc(displayName(c))}</div>
            <div class="c-time">${last ? fmtTime(last.ts) : ''}</div>
          </div>
          <div class="c-bottom">
            <div class="c-prev">${c.pending ? '等待对方确认…' : esc(last ? previewText(last) : '点击开始聊天')}</div>
            ${unread ? `<div class="c-badge">${unread > 99 ? '99+' : unread}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

function renderChatHeader(){
  const head = $('#chatHead');
  const c = getActive();
  if (!c){
    head.innerHTML = `<div class="chat-title" style="color:var(--text-faint);font-weight:400">未选择会话</div>`;
    return;
  }
  const typing = c.typingUntil && c.typingUntil > now();
  let sub;
  if (c.pending) sub = '<span>等待对方确认…</span>';
  else if (typing) sub = '<span style="color:var(--accent)">正在输入…</span>';
  else if (c.online) sub = '<span class="dot on"></span><span>在线</span>';
  else sub = '<span class="dot"></span><span>离线</span>';

  head.innerHTML = `
    <button class="icon-btn back" id="btnBack" title="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="min-width:0">
      <div class="chat-title">${esc(displayName(c))}</div>
      <div class="chat-sub">${sub}</div>
    </div>
    <div class="chat-actions">
      <button class="icon-btn" id="btnInfo" title="会话信息">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
    </div>`;

  const back = $('#btnBack');
  if (back) back.addEventListener('click', () => {
    document.body.classList.remove('chatting');
    activeCode = null;
    saveActive();
    renderContacts();
    renderChat();
  });
  const info = $('#btnInfo');
  if (info) info.addEventListener('click', () => showInfo(c));
}

function msgHtml(m, prev){
  const gap = prev && (m.dir !== prev.dir || (m.ts - prev.ts) > 300000) ? ' gap' : '';

  if (m.recalled){
    return `<div class="msg ${m.dir}${gap}"><div class="bubble recalled">消息已撤回</div><div class="meta">${fmtTime(m.ts)}</div></div>`;
  }

  let inner;
  if (m.type === 'image' && m.data){
    inner = `<div class="bubble img"><img src="data:${esc(m.mime || 'image/png')};base64,${m.data}" loading="lazy" alt=""></div>`;
  } else if (m.type === 'file' && m.data){
    inner = `<div class="bubble file" data-dl="${esc(m.msgId)}">
      <div class="f-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
      <div style="min-width:0">
        <div class="f-name">${esc(m.fileName || '文件')}</div>
        <div class="f-size">${fmtSize(m.size)}</div>
      </div>
    </div>`;
  } else {
    inner = `<div class="bubble">${esc(m.text || '')}</div>`;
  }

  const meta = `<div class="meta">${fmtTime(m.ts)}${m.dir === 'out' ? (m.read ? ' · 已读' : ' · 已发送') : ''}</div>`;
  return `<div class="msg ${m.dir}${gap}" data-msgid="${esc(m.msgId)}">${inner}${meta}</div>`;
}

function renderChat(){
  const c = getActive();
  const box = $('#messages');
  const input = $('#msgInput');
  const sendBtn = $('#btnSend');
  const attachBtn = $('#btnAttach');

  renderChatHeader();

  if (!c){
    box.innerHTML = `
      <div class="empty-chat">
        <div class="big">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <b>海鸥</b>
        从左侧选择一个联系人<br>或点击「配对」输入邀请码
      </div>`;
    input.disabled = true; sendBtn.disabled = true; attachBtn.disabled = true;
    input.value = ''; input.placeholder = '选择联系人开始聊天';
    return;
  }

  if (!c.msgs.length){
    box.innerHTML = `
      <div class="empty-chat">
        <div class="big">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <b>${esc(displayName(c))}</b>
        ${c.pending ? '正在等待对方确认…' : '还没有消息，打个招呼吧'}
      </div>`;
  } else {
    const parts = [];
    let prevDay = '';
    let prevMsg = null;
    c.msgs.forEach(m => {
      const d = new Date(m.ts);
      const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if (key !== prevDay){
        prevDay = key;
        parts.push(`<div class="day">${d.getMonth()+1}月${d.getDate()}日</div>`);
        prevMsg = null;
      }
      parts.push(msgHtml(m, prevMsg));
      prevMsg = m;
    });
    box.innerHTML = parts.join('');
  }

  const canSend = !!c.pubJwk && !c.pending;
  input.disabled = !canSend;
  sendBtn.disabled = !canSend;
  attachBtn.disabled = !canSend;
  input.placeholder = c.pending ? '等待对方确认…' : (canSend ? '输入消息…' : '等待密钥交换…');

  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

/* ==========================================================
   Toast
   ========================================================== */
function toast(text){
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

/* ==========================================================
   配对流程
   ========================================================== */
function openPair(){
  $('#myCodeVal').textContent = fmtCode(me.code);
  $('#peerCodeInput').value = '';
  $('#pairOverlay').classList.add('show');
  setTimeout(() => { try { $('#peerCodeInput').focus(); } catch(e){} }, 60);
}
function closePair(){ $('#pairOverlay').classList.remove('show'); }

async function doPair(){
  const raw = $('#peerCodeInput').value;
  const code = normCode(raw);
  if (code.length !== CODE_LEN){ toast('邀请码格式不正确'); return; }
  if (code === me.code){ toast('不能和自己配对'); return; }
  if (findContact(code)){ toast('该邀请码已在联系人列表中'); return; }

  const c = {
    code,
    peerId: null,
    name: '',
    pubJwk: null,
    msgs: [],
    lastSeen: 0,
    online: false,
    pending: true,
    unread: 0,
    createdAt: now()
  };
  contacts.unshift(c);
  activeCode = code;
  saveContacts();
  saveActive();
  renderContacts();
  renderChat();
  closePair();
  document.body.classList.add('chatting');

  sendHello(c);
  startHelloRetry();
  toast('配对请求已发送');
}

/* ==========================================================
   会话信息
   ========================================================== */
function showInfo(c){
  const fp = identity ? identity.fp : '—';
  const peerFp = c.pubJwk && c.pubJwk.x ? c.pubJwk.x.slice(0,16).toUpperCase() : '—';
  const lines = [
    '名称：' + displayName(c),
    '邀请码：' + fmtCode(c.code),
    '',
    '我的指纹：' + fp,
    '对方公钥：' + peerFp,
    '',
    '消息数：' + c.msgs.length
  ];
  alert(lines.join('\n'));
}

/* ==========================================================
   设置
   ========================================================== */
function openSettings(){
  $('#setTheme').value = settings.theme;
  $('#setName').value = settings.name || '';
  $('#setCodeHint').textContent = fmtCode(me.code);
  $('#setFp').textContent = identity ? identity.fp : '—';
  $('#setOverlay').classList.add('show');
}
function closeSettings(){ $('#setOverlay').classList.remove('show'); }

function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme === 'light' ? 'light' : 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = settings.theme === 'light' ? '#ffffff' : '#0a0a0b';
}

function regenCode(){
  if (!confirm('重新生成后，所有联系人需要重新配对，确定继续吗？')) return;
  me.code = genCode();
  saveMe();
  // 重新订阅
  if (Net.client && Net.ready){
    const old = Net.subscribed;
    Net.subscribed = null;
    if (old){ try { Net.client.unsubscribe(old); } catch(e){} }
    subscribeMine();
  }
  $('#myCodeVal').textContent = fmtCode(me.code);
  $('#setCodeHint').textContent = fmtCode(me.code);
  $('#meCode').textContent = fmtCode(me.code);
  toast('邀请码已更新');
}

function resetAll(){
  if (!confirm('将清空所有联系人和聊天记录，并重置身份，确定吗？')) return;
  localStorage.removeItem(LS.contacts);
  localStorage.removeItem(LS.identity);
  localStorage.removeItem(LS.active);
  location.reload();
}

/* ==========================================================
   状态维护
   ========================================================== */
function saveActive(){
  try {
    if (activeCode) localStorage.setItem(LS.active, activeCode);
    else localStorage.removeItem(LS.active);
  } catch(e){}
}
function loadActive(){
  try {
    const v = localStorage.getItem(LS.active);
    if (v && findContact(v)) activeCode = v;
  } catch(e){}
}

function tickPresence(){
  let changed = false;
  const t = now();
  contacts.forEach(c => {
    const on = !!(c.lastSeen && (t - c.lastSeen < 60000));
    if (on !== c.online){ c.online = on; changed = true; }
  });
  if (changed){ renderContacts(); if (activeCode) renderChatHeader(); }
}

/* ==========================================================
   事件绑定
   ========================================================== */
function bindEvents(){
  // 侧栏
  $('#btnPair').addEventListener('click', openPair);
  $('#searchInput').addEventListener('input', renderContacts);
  $('#meRow').addEventListener('click', openSettings);

  $('#contactList').addEventListener('click', e => {
    const el = e.target.closest('.contact');
    if (!el) return;
    const code = el.dataset.code;
    const c = findContact(code);
    if (!c) return;
    activeCode = code;
    c.unread = 0;
    saveActive();
    document.body.classList.add('chatting');
    renderContacts();
    renderChat();

    // 标记已读
    const unread = c.msgs.filter(m => m.dir === 'in' && !m.read);
    if (unread.length){
      unread.forEach(m => m.read = true);
      saveContacts();
      publish(topicFor(c.code), {
        t: 'read', from: profile(), msgIds: unread.map(m => m.msgId), ts: now()
      });
    }
    setTimeout(() => { try { if (!$('#msgInput').disabled) $('#msgInput').focus(); } catch(e){} }, 50);
  });

  // 配对弹窗
  $('#btnPairCancel').addEventListener('click', closePair);
  $('#btnPairConfirm').addEventListener('click', doPair);
  $('#peerCodeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); doPair(); }
  });
  $('#peerCodeInput').addEventListener('input', e => {
    const pos = e.target.selectionStart;
    const before = e.target.value;
    const formatted = fmtCode(normCode(before));
    if (before !== formatted){
      e.target.value = formatted;
      const delta = formatted.length - before.length;
      try { e.target.setSelectionRange(pos + delta, pos + delta); } catch(err){}
    }
  });
  $('#pairOverlay').addEventListener('click', e => { if (e.target.id === 'pairOverlay') closePair(); });

  $('#myCodeVal').addEventListener('click', () => {
    navigator.clipboard.writeText(fmtCode(me.code))
      .then(() => toast('已复制'))
      .catch(() => toast('复制失败'));
  });
  $('#btnCopyCode').addEventListener('click', () => {
    navigator.clipboard.writeText(fmtCode(me.code))
      .then(() => toast('已复制'))
      .catch(() => toast('复制失败'));
  });
  $('#btnRegen').addEventListener('click', regenCode);

  // 设置
  $('#btnSetClose').addEventListener('click', closeSettings);
  $('#setOverlay').addEventListener('click', e => { if (e.target.id === 'setOverlay') closeSettings(); });
  $('#setTheme').addEventListener('change', e => {
    settings.theme = e.target.value;
    saveSettings();
    applyTheme();
  });
  $('#setName').addEventListener('input', e => {
    settings.name = e.target.value.trim();
    me.name = settings.name;
    saveMe();
    saveSettings();
    $('#meName').textContent = me.name || '未设置昵称';
    // 通知在线联系人
    contacts.forEach(c => {
      if (c.online) publish(topicFor(c.code), { t:'hello-ack', from: profile(), ts: now() });
    });
  });
  $('#btnRegen2').addEventListener('click', regenCode);
  $('#btnReset').addEventListener('click', resetAll);

  // 发送
  $('#btnSend').addEventListener('click', sendMessage);
  $('#msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      sendMessage();
    }
  });

  let typingSent = 0;
  $('#msgInput').addEventListener('input', () => {
    const c = getActive();
    if (!c || !c.pubJwk) return;
    const t = now();
    if (t - typingSent < 2500) return;
    typingSent = t;
    publish(topicFor(c.code), { t:'typing', from: profile(), ts: t });
  });

  // 附件
  $('#btnAttach').addEventListener('click', () => {
    const c = getActive();
    if (!c || !c.pubJwk) return;
    $('#fileInput').value = '';
    $('#fileInput').click();
  });
  $('#fileInput').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) handleFile(f);
  });

  // 消息区
  $('#messages').addEventListener('click', e => {
    const img = e.target.closest('.bubble.img img');
    if (img){ openLightbox(img.src); return; }
    const dl = e.target.closest('[data-dl]');
    if (dl){ downloadMsg(dl.dataset.dl); return; }
  });
  $('#lightbox').addEventListener('click', () => {
    $('#lightbox').classList.remove('show');
    $('#lightboxImg').src = '';
  });

  // 快捷键
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if ($('#lightbox').classList.contains('show')){
        $('#lightbox').classList.remove('show');
        $('#lightboxImg').src = '';
      } else if ($('#pairOverlay').classList.contains('show')) closePair();
      else if ($('#setOverlay').classList.contains('show')) closeSettings();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k'){
      e.preventDefault();
      try { $('#searchInput').focus(); } catch(err){}
    }
  });
}

/* ==========================================================
   文件
   ========================================================== */
const MAX_FILE = 3 * 1024 * 1024;

function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || '');
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i+1) : '');
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

async function handleFile(file){
  const c = getActive();
  if (!c) return;
  if (file.size > MAX_FILE){ toast('文件超过 3MB'); return; }

  let data;
  try { data = await readFileAsBase64(file); }
  catch(e){ toast('读取文件失败'); return; }

  const isImg = /^image\//.test(file.type || '');
  await sendPayload(c, {
    type: isImg ? 'image' : 'file',
    fileName: file.name,
    mime: file.type || 'application/octet-stream',
    size: file.size,
    data
  });
}

function downloadMsg(msgId){
  const c = getActive();
  if (!c) return;
  const m = c.msgs.find(x => x.msgId === msgId);
  if (!m || !m.data){ toast('文件数据不可用'); return; }
  try {
    const bytes = unb64(m.data);
    const blob = new Blob([bytes], { type: m.mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = m.fileName || 'file';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch(e){ toast('下载失败'); }
}

function openLightbox(src){
  $('#lightboxImg').src = src;
  $('#lightbox').classList.add('show');
}

/* ==========================================================
   启动
   ========================================================== */
async function boot(){
  me = loadMe();
  loadSettings();
  loadContacts();
  loadActive();

  if (settings.name){ me.name = settings.name; }

  applyTheme();

  await initIdentity();

  // 界面
  $('#meName').textContent = me.name || '未设置昵称';
  $('#meCode').textContent = fmtCode(me.code);
  $('#meAvatar').textContent = (me.name || '我').trim().charAt(0).toUpperCase();

  bindEvents();
  renderContacts();
  renderChat();
  startHelloRetry();

  if (activeCode) document.body.classList.add('chatting');

  // 网络
  await connectNet();

  // 在线状态定时器
  setInterval(tickPresence, 5000);
}

window.addEventListener('beforeunload', () => {
  saveContacts();
  saveMe();
});

boot();

})();
</script>
