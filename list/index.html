<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Photaxis Lab</title>
<meta name="description" content="Project directory of Photaxis Lab.">
<meta name="theme-color" content="#0a0e1f">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://slcleo-usa.github.io/list/">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% 40%, #141c3a 0%, #0a0e1f 55%, #04050c 100%);
  color:#f5f5f7;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* ── 语言切换器 ── */
.lang-switcher{
  position:fixed;
  top:20px;
  right:20px;
  z-index:100;
}
.lang-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  font-size:0.85rem;
  font-family:inherit;
  color:#d1d1d6;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:999px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:background 0.2s, border-color 0.2s, color 0.2s;
}
.lang-btn:hover{
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.2);
  color:#fff;
}
.lang-btn svg{
  width:12px;height:12px;
  transition:transform 0.2s;
}
.lang-switcher.open .lang-btn svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  min-width:170px;
  padding:6px;
  background:rgba(20,24,40,0.96);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px);
  transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}
.lang-switcher.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  display:block;
  width:100%;
  padding:10px 14px;
  font-size:0.9rem;
  font-family:inherit;
  color:#d1d1d6;
  background:transparent;
  border:none;
  border-radius:9px;
  text-align:left;
  cursor:pointer;
  transition:background 0.15s, color 0.15s;
}
.lang-menu button:hover{
  background:rgba(255,255,255,0.08);
  color:#fff;
}
.lang-menu button.active{
  color:#5ac8fa;
  background:rgba(90,200,250,0.1);
}

/* ── 容器 ── */
.container{
  position:relative;
  z-index:1;
  max-width:760px;
  margin:0 auto;
  padding:120px 24px 80px;
}

/* ── 返回链接 ── */
.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:0.9rem;
  color:#8e8e93;
  text-decoration:none;
  margin-bottom:40px;
  transition:color 0.2s, gap 0.2s;
}
.back-link:hover{
  color:#5ac8fa;
  gap:12px;
}

/* ── 标题区 ── */
.page-header{
  margin-bottom:56px;
}
.page-header h1{
  font-size:clamp(2rem,5vw,3rem);
  font-weight:500;
  letter-spacing:-0.02em;
  margin-bottom:16px;
  background:linear-gradient(135deg,#f5f5f7 0%,#9fc9ff 60%,#6ee7ff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.page-header p{
  font-size:1rem;
  color:#8e8e93;
  line-height:1.7;
}

/* ── 目录 ── */
.directory-title{
  font-size:0.8rem;
  font-weight:500;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:#6e6e73;
  margin-bottom:20px;
}
.directory{
  display:grid;
  gap:14px;
}
.directory-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:22px 26px;
  border-radius:16px;
  background:rgba(255,255,255,0.035);
  border:1px solid rgba(255,255,255,0.08);
  text-decoration:none;
  transition:transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.directory-item:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,0.055);
  border-color:rgba(90,200,250,0.25);
  box-shadow:0 16px 40px rgba(0,0,0,0.35);
}
.directory-item-text{
  text-align:left;
}
.directory-item-title{
  display:block;
  font-size:1.1rem;
  font-weight:500;
  color:#f5f5f7;
  margin-bottom:6px;
}
.directory-item-desc{
  display:block;
  font-size:0.9rem;
  color:#8e8e93;
  line-height:1.6;
}
.directory-item-arrow{
  font-size:1.2rem;
  color:#5ac8fa;
  flex-shrink:0;
  transition:transform 0.25s ease;
}
.directory-item:hover .directory-item-arrow{
  transform:translateX(4px);
}

footer{
  margin-top:80px;
  font-size:0.85rem;
  color:#6e6e73;
}

/* ── 动画 ── */
@keyframes softFade{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}
.page-header,
.directory-title,
.directory-item{
  animation:softFade 0.8s ease-out both;
}
.directory-item:nth-child(1){animation-delay:0.05s;}
.directory-item:nth-child(2){animation-delay:0.12s;}
.directory-item:nth-child(3){animation-delay:0.19s;}

/* ── 焦点可见 ── */
:focus-visible{
  outline:2px solid rgba(90,200,250,0.6);
  outline-offset:3px;
  border-radius:16px;
}

/* ── 减少动画 ── */
@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}

/* ── 移动端 ── */
@media (max-width:640px){
  .lang-switcher{top:14px;right:14px;}
  .lang-btn{padding:7px 12px;font-size:0.8rem;}
  .lang-menu{min-width:150px;}
  .container{padding:90px 18px 60px;}
  .directory-item{padding:18px 20px;border-radius:14px;}
  .directory-item-title{font-size:1rem;}
  .directory-item-desc{font-size:0.85rem;}
}
</style>
</head>
<body>

<!-- 语言切换 -->
<div class="lang-switcher" id="langSwitcher">
  <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
    <span id="currentLang">English</span>
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4.5 6 7.5 9 4.5"/>
    </svg>
  </button>
  <div class="lang-menu" id="langMenu" role="menu">
    <button type="button" data-lang="en"    role="menuitem">English</button>
    <button type="button" data-lang="zh-CN" role="menuitem">中文</button>
    <button type="button" data-lang="fr"    role="menuitem">Français</button>
    <button type="button" data-lang="es"    role="menuitem">Español</button>
    <button type="button" data-lang="de"    role="menuitem">Deutsch</button>
    <button type="button" data-lang="wuu"   role="menuitem">上海话</button>
  </div>
</div>

<div class="container">

  <a class="back-link" href="https://slcleo-usa.github.io/" data-i18n="backLink"></a>

  <header class="page-header">
    <h1 data-i18n="pageTitle"></h1>
    <p data-i18n="pageDesc"></p>
  </header>

  <p class="directory-title" data-i18n="directoryTitle"></p>

  <div class="directory">

    <a class="directory-item" href="https://slcleo-usa.github.io/communication/">
      <span class="directory-item-text">
        <span class="directory-item-title" data-i18n="commTitle"></span>
        <span class="directory-item-desc" data-i18n="commDesc"></span>
      </span>
      <span class="directory-item-arrow">→</span>
    </a>

    <a class="directory-item" href="https://slcleo-usa.github.io/flighttime/">
      <span class="directory-item-text">
        <span class="directory-item-title" data-i18n="flightTitle"></span>
        <span class="directory-item-desc" data-i18n="flightDesc"></span>
      </span>
      <span class="directory-item-arrow">→</span>
    </a>

    <a class="directory-item" href="https://slcleo-usa.github.io/chemistrygame/">
      <span class="directory-item-text">
        <span class="directory-item-title" data-i18n="chemTitle"></span>
        <span class="directory-item-desc" data-i18n="chemDesc"></span>
      </span>
      <span class="directory-item-arrow">→</span>
    </a>

  </div>

  <footer data-i18n="footer"></footer>
</div>

<script>
/* ══════════════════════════════════════════
   多语言文案
   ══════════════════════════════════════════ */
const I18N = {

  "en": {
    langName: "English",
    backLink: "← Back to Photaxis Lab",
    pageTitle: "Projects",
    pageDesc: "A directory of all projects under Photaxis Lab.",
    directoryTitle: "Directory",
    commTitle: "Communication",
    commDesc: "Notes, experiments and tools related to communication.",
    flightTitle: "Flight Time Calculator",
    flightDesc: "Calculate flight time and related information.",
    chemTitle: "Chemistry Game",
    chemDesc: "An interactive game for learning chemistry.",
    footer: "© Photaxis Lab 2026. All rights reserved."
  },

  "zh-CN": {
    langName: "中文",
    backLink: "← 返回 Photaxis Lab",
    pageTitle: "项目",
    pageDesc: "Photaxis Lab 下的所有项目目录。",
    directoryTitle: "目录",
    commTitle: "通信项目",
    commDesc: "与通信相关的笔记、实验和工具。",
    flightTitle: "航班时间计算器",
    flightDesc: "计算航班时间及相关信息。",
    chemTitle: "化学游戏",
    chemDesc: "一个学习化学的互动游戏。",
    footer: "© Photaxis Lab 2026 保留所有权利。"
  },

  "fr": {
    langName: "Français",
    backLink: "← Retour à Photaxis Lab",
    pageTitle: "Projets",
    pageDesc: "Un répertoire de tous les projets de Photaxis Lab.",
    directoryTitle: "Répertoire",
    commTitle: "Communication",
    commDesc: "Notes, expérimentations et outils liés à la communication.",
    flightTitle: "Calculateur de temps de vol",
    flightDesc: "Calculer le temps de vol et les informations associées.",
    chemTitle: "Jeu de chimie",
    chemDesc: "Un jeu interactif pour apprendre la chimie.",
    footer: "© Photaxis Lab 2026. Tous droits réservés."
  },

  "es": {
    langName: "Español",
    backLink: "← Volver a Photaxis Lab",
    pageTitle: "Proyectos",
    pageDesc: "Un directorio de todos los proyectos de Photaxis Lab.",
    directoryTitle: "Directorio",
    commTitle: "Comunicación",
    commDesc: "Notas, experimentos y herramientas relacionadas con la comunicación.",
    flightTitle: "Calculadora de tiempo de vuelo",
    flightDesc: "Calcular el tiempo de vuelo y la información relacionada.",
    chemTitle: "Juego de química",
    chemDesc: "Un juego interactivo para aprender química.",
    footer: "© Photaxis Lab 2026. Todos los derechos reservados."
  },

  "de": {
    langName: "Deutsch",
    backLink: "← Zurück zu Photaxis Lab",
    pageTitle: "Projekte",
    pageDesc: "Ein Verzeichnis aller Projekte von Photaxis Lab.",
    directoryTitle: "Verzeichnis",
    commTitle: "Kommunikation",
    commDesc: "Notizen, Experimente und Werkzeuge rund um Kommunikation.",
    flightTitle: "Flugzeitrechner",
    flightDesc: "Flugzeit und zugehörige Informationen berechnen.",
    chemTitle: "Chemiespiel",
    chemDesc: "Ein interaktives Spiel zum Chemielernen.",
    footer: "© Photaxis Lab 2026. Alle Rechte vorbehalten."
  },

  /* 上海话——文字表达，幽默口语 */
  "wuu": {
    langName: "上海话",
    backLink: "← 回转 Photaxis Lab",
    pageTitle: "项目",
    pageDesc: "Photaxis Lab 下头个项目，一塌刮子侪摆了海。",
    directoryTitle: "目录",
    commTitle: "通信项目",
    commDesc: "跟通信有关个笔记、实验搭仔小工具。",
    flightTitle: "航班辰光计算器",
    flightDesc: "算算航班要飞几化辰光，搭仔其他相关信息。",
    chemTitle: "化学游戏",
    chemDesc: "一只学习化学个互动小游戏。",
    footer: "© Photaxis Lab 2026 版权所有。"
  }
};


/* ══════════════════════════════════════════
   语言切换逻辑
   ══════════════════════════════════════════ */
(() => {
  "use strict";

  const STORAGE_KEY = "photaxis-lang";

  const switcher = document.getElementById("langSwitcher");
  const langBtn  = document.getElementById("langBtn");
  const langMenu = document.getElementById("langMenu");
  const currentLangEl = document.getElementById("currentLang");

  function detectLang() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && I18N[saved]) return saved;
    return "en"; // 默认英语
  }

  function applyLang(lang) {
    const t = I18N[lang] || I18N.en;

    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (t[key] !== undefined) el.innerHTML = t[key];
    });

    currentLangEl.textContent = t.langName;

    langMenu.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });

    localStorage.setItem(STORAGE_KEY, lang);
  }

  langBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = switcher.classList.toggle("open");
    langBtn.setAttribute("aria-expanded", String(open));
  });

  langMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (btn) {
      applyLang(btn.dataset.lang);
      switcher.classList.remove("open");
      langBtn.setAttribute("aria-expanded", "false");
    }
    e.stopPropagation();
  });

  document.addEventListener("click", () => {
    switcher.classList.remove("open");
    langBtn.setAttribute("aria-expanded", "false");
  });

  applyLang(detectLang());
})();
</script>
</body>
</html>
