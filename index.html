<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLC.Leo</title>
<meta name="description" content="SLC.Leo — a personal studio exploring aviation, railways, programming and operating system development.">
<meta name="theme-color" content="#04050c">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://slcleo-usa.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="SLC.Leo">
<meta property="og:description" content="Explore. Create. Iterate.">
<meta property="og:url" content="https://slcleo-usa.github.io/">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% 45%, #141c3a 0%, #0a0e1f 48%, #04050c 100%);
  color:#f5f5f7;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* ── 星尘画布 ── */
#stars{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}

/* ── 语言切换器 ── */
.lang-switcher{
  position:fixed;
  top:20px;
  right:20px;
  z-index:100;
}
.lang-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  font-size:0.85rem;
  font-family:inherit;
  color:#d1d1d6;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:999px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:background 0.2s, border-color 0.2s, color 0.2s;
}
.lang-btn:hover{
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.2);
  color:#fff;
}
.lang-btn svg{
  width:12px;height:12px;
  transition:transform 0.2s;
}
.lang-switcher.open .lang-btn svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  min-width:170px;
  padding:6px;
  background:rgba(20,24,40,0.96);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px);
  transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}
.lang-switcher.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  display:block;
  width:100%;
  padding:10px 14px;
  font-size:0.9rem;
  font-family:inherit;
  color:#d1d1d6;
  background:transparent;
  border:none;
  border-radius:9px;
  text-align:left;
  cursor:pointer;
  transition:background 0.15s, color 0.15s;
}
.lang-menu button:hover{
  background:rgba(255,255,255,0.08);
  color:#fff;
}
.lang-menu button.active{
  color:#5ac8fa;
  background:rgba(90,200,250,0.1);
}

/* ── 容器 ── */
.container{
  position:relative;
  z-index:1;
  max-width:980px;
  margin:0 auto;
  padding:100px 24px 80px;
  text-align:center;
}

/* ── Hero ── */
.hero{margin-bottom:90px;}

h1{
  font-size:clamp(2.5rem,6vw,4rem);
  font-weight:500;
  letter-spacing:-0.02em;
  margin-bottom:16px;
  background:linear-gradient(135deg,#f5f5f7 0%,#9fc9ff 60%,#6ee7ff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  font-size:clamp(1rem,2vw,1.2rem);
  color:#8e8e93;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:0.02em;
  margin-bottom:44px;
}
.desc{
  font-size:1.1rem;
  color:#c7c7cc;
  line-height:1.75;
  margin-bottom:52px;
}
.btn-group{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  align-items:center;
}
.btn{
  font-size:1rem;
  font-family:inherit;
  padding:13px 28px;
  border-radius:999px;
  text-decoration:none;
  cursor:pointer;
  transition:background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  white-space:nowrap;
}
.btn-primary{
  background:#5ac8fa;
  color:#04121f;
  border:1px solid #5ac8fa;
  font-weight:500;
}
.btn-primary:hover{
  background:#7dd3fc;
  border-color:#7dd3fc;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(90,200,250,0.3);
}
.btn-outline{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.18);
  color:#e5e5ea;
}
.btn-outline:hover{
  background:rgba(255,255,255,0.09);
  border-color:rgba(255,255,255,0.3);
  transform:translateY(-2px);
}

/* ── 卡片 ── */
.project-list{display:grid;gap:28px;}
.project-card{
  text-align:left;
  padding:36px;
  border-radius:20px;
  background:rgba(255,255,255,0.035);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
}
.project-card:hover{
  transform:translateY(-6px);
  background:rgba(255,255,255,0.055);
  border-color:rgba(90,200,250,0.25);
  box-shadow:0 16px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(90,200,250,0.1);
}
.project-card h3{
  font-size:1.4rem;
  font-weight:500;
  margin-bottom:12px;
  color:#f5f5f7;
}
.project-card p{
  color:#a1a1a6;
  line-height:1.75;
  margin-bottom:22px;
}
.project-link{
  color:#5ac8fa;
  text-decoration:none;
  font-size:0.95rem;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:gap 0.2s;
}
.project-link:hover{
  gap:10px;
}

footer{
  margin-top:100px;
  font-size:0.85rem;
  color:#6e6e73;
}

/* ── 动画 ── */
@keyframes softFade{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}
.hero,
.project-card{
  animation:softFade 0.9s ease-out both;
}

/* ── 焦点可见 ── */
:focus-visible{
  outline:2px solid rgba(90,200,250,0.6);
  outline-offset:3px;
  border-radius:999px;
}

/* ── 减少动画 ── */
@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}

/* ── 移动端 ── */
@media (max-width:640px){
  .lang-switcher{top:14px;right:14px;}
  .lang-btn{padding:7px 12px;font-size:0.8rem;}
  .lang-menu{min-width:150px;}
  .container{padding:80px 18px 60px;}
  .hero{margin-bottom:60px;}
  .project-card{padding:26px;border-radius:16px;}
  .btn-group{flex-direction:column;gap:12px;width:100%;}
  .btn{width:100%;text-align:center;}
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<!-- 语言切换 -->
<div class="lang-switcher" id="langSwitcher">
  <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
    <span id="currentLang">English</span>
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4.5 6 7.5 9 4.5"/>
    </svg>
  </button>
  <div class="lang-menu" id="langMenu" role="menu">
    <button type="button" data-lang="en"    role="menuitem">English</button>
    <button type="button" data-lang="zh-CN" role="menuitem">中文</button>
    <button type="button" data-lang="fr"    role="menuitem">Français</button>
  </div>
</div>

<div class="container">

  <!-- Hero -->
  <header class="hero">
    <h1>SLC.Leo</h1>
    <p class="subtitle">slcleo-usa.github.io</p>
    <p class="desc" data-i18n="heroDesc"></p>

    <div class="btn-group">
      <a class="btn btn-primary" href="mailto:godsunwyyx123spx@163.com" data-i18n="emailBtn"></a>
      <a class="btn btn-outline" href="https://github.com/SLCLeo-USA/SLC.Leo"
         target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </header>

  <!-- 唯一栏目 -->
  <div class="project-list">
    <article class="project-card">
      <h3 data-i18n="entryTitle"></h3>
      <p data-i18n="entryDesc"></p>
      <a class="project-link"
         href="https://slcleo-usa.github.io/photaxis-lab/"
         data-i18n="entryLink"></a>
    </article>
  </div>

  <footer data-i18n="footer"></footer>
</div>

<script>
/* ══════════════════════════════════════════
   星尘背景
   ══════════════════════════════════════════ */
(() => {
  "use strict";

  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d", { alpha: true });
  const TAU = Math.PI * 2;

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let lastTime = performance.now();

  const CFG = {
    linkDist: 110,
    density:  3000,
    maxCount: 520
  };

  const LINK2 = CFG.linkDist * CFG.linkDist;

  function targetCount() {
    const base = (W * H) / CFG.density;
    return Math.round(Math.min(CFG.maxCount, Math.max(180, base)));
  }

  function makeParticle() {
    const a = Math.random() * TAU;
    const s = 0.06 + Math.random() * 0.26;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      dx: Math.cos(a) * s,
      dy: Math.sin(a) * s,
      r: 0.7 + Math.random() * 1.6,
      hue: 185 + Math.random() * 95,
      pulse: Math.random() * TAU,
      fade: 0
    };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const t = targetCount();
    if (particles.length > t) particles.length = t;
    while (particles.length < t) particles.push(makeParticle());
  }

  function updateParticle(p, dt) {
    p.x += p.dx * dt;
    p.y += p.dy * dt;

    const m = 30;
    if (p.x < -m) p.x = W + m;
    else if (p.x > W + m) p.x = -m;
    if (p.y < -m) p.y = H + m;
    else if (p.y > H + m) p.y = -m;

    p.pulse += 0.05 * dt;
    if (p.fade < 1) p.fade = Math.min(1, p.fade + 0.025 * dt);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "round";

    const n = particles.length;
    const linkAlpha = 0.30 * Math.min(1, 240 / Math.max(n, 1));

    for (let i = 0; i < n; i++) {
      const a = particles[i];
      const ax = a.x, ay = a.y;

      for (let j = i + 1; j < n; j++) {
        const b = particles[j];
        const dx = ax - b.x;
        const dy = ay - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > LINK2) continue;

        const alpha = (1 - Math.sqrt(d2) / CFG.linkDist) * linkAlpha;
        ctx.strokeStyle = `hsla(${(a.hue + b.hue) * 0.5}, 90%, 74%, ${alpha})`;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }

    for (const p of particles) {
      const r = p.r * (1 + 0.35 * Math.sin(p.pulse));
      ctx.globalAlpha = p.fade;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fillStyle = `hsla(${p.hue}, 95%, 76%, 0.9)`;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function adapt() {
    const t = targetCount();
    if (particles.length < t) {
      const add = Math.min(4, t - particles.length);
      for (let i = 0; i < add; i++) particles.push(makeParticle());
    } else if (particles.length > t) {
      particles.length -= Math.min(4, particles.length - t);
    }
  }

  function frame(now) {
    const dt = Math.min((now - lastTime) / 16.667, 3);
    lastTime = now;

    adapt();
    for (const p of particles) updateParticle(p, dt);
    draw();

    requestAnimationFrame(frame);
  }

  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(resize, 150);
  }, { passive: true });

  resize();
  requestAnimationFrame(frame);
})();


/* ══════════════════════════════════════════
   多语言文案
   ══════════════════════════════════════════ */
const I18N = {

  "en": {
    langName: "English",
    heroDesc: "Explore. Create. Iterate.<br>A minimalist static site hosted on GitHub Pages.",
    emailBtn: "Email",
    entryTitle: "Photaxis Lab",
    entryDesc: "Enter the main site. You will find projects, notes and experiments there.",
    entryLink: "Enter →",
    footer: "© SLC.Leo 2026. All rights reserved."
  },

  "zh-CN": {
    langName: "中文",
    heroDesc: "探索。创造。迭代。<br>一个托管在 GitHub Pages 上的极简静态站点。",
    emailBtn: "邮件",
    entryTitle: "Photaxis Lab",
    entryDesc: "进入主站。那里有项目、笔记和实验。",
    entryLink: "进入 →",
    footer: "© SLC.Leo 2026 保留所有权利。"
  },

  "fr": {
    langName: "Français",
    heroDesc: "Explorer. Créer. Itérer.<br>Un site statique minimaliste hébergé sur GitHub Pages.",
    emailBtn: "E-mail",
    entryTitle: "Photaxis Lab",
    entryDesc: "Entrez sur le site principal. Vous y trouverez des projets, des notes et des expérimentations.",
    entryLink: "Entrer →",
    footer: "© SLC.Leo 2026. Tous droits réservés."
  }
};


/* ══════════════════════════════════════════
   语言切换逻辑
   ══════════════════════════════════════════ */
(() => {
  "use strict";

  const STORAGE_KEY = "slcleo-lang";

  const switcher = document.getElementById("langSwitcher");
  const langBtn  = document.getElementById("langBtn");
  const langMenu = document.getElementById("langMenu");
  const currentLangEl = document.getElementById("currentLang");

  function detectLang() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && I18N[saved]) return saved;
    return "en";
  }

  function applyLang(lang) {
    const t = I18N[lang] || I18N.en;

    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (t[key] !== undefined) el.innerHTML = t[key];
    });

    currentLangEl.textContent = t.langName;

    langMenu.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });

    localStorage.setItem(STORAGE_KEY, lang);
  }

  langBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = switcher.classList.toggle("open");
    langBtn.setAttribute("aria-expanded", String(open));
  });

  langMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (btn) {
      applyLang(btn.dataset.lang);
      switcher.classList.remove("open");
      langBtn.setAttribute("aria-expanded", "false");
    }
    e.stopPropagation();
  });

  document.addEventListener("click", () => {
    switcher.classList.remove("open");
    langBtn.setAttribute("aria-expanded", "false");
  });

  applyLang(detectLang());
})();
</script>
</body>
</html>
