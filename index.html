<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLC.Leo</title>
<meta name="description" content="SLC.Leo — a personal studio exploring aviation, railways, programming and operating system development.">
<meta name="theme-color" content="#fbfbfd">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://slcleo-usa.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="SLC.Leo">
<meta property="og:description" content="Explore. Create. Iterate.">
<meta property="og:url" content="https://slcleo-usa.github.io/">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco","Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:#fbfbfd;
  color:#1d1d1f;
  min-height:100vh;
  padding:64px 24px 80px;
  transition:background 0.5s ease, color 0.5s ease;
}

.container{
  max-width:980px;
  margin:0 auto;
  text-align:center;
  position:relative;
}

/* ── Hero ── */
.hero{
  margin-bottom:120px;
}
h1{
  font-size:clamp(2.5rem,6vw,4rem);
  font-weight:500;
  letter-spacing:-0.02em;
  margin-bottom:16px;
  color:#1d1d1f;
}
.subtitle{
  font-size:clamp(1.1rem,2vw,1.3rem);
  color:#6e6e73;
  font-weight:400;
  margin-bottom:48px;
  line-height:1.5;
}
.desc{
  font-size:1.125rem;
  color:#424245;
  line-height:1.7;
  margin-bottom:56px;
}
.btn-group{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  font-size:1.05rem;
  font-family:inherit;
  padding:14px 28px;
  border-radius:999px;
  text-decoration:none;
  cursor:pointer;
  transition:background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  white-space:nowrap;
}
.btn-primary{
  background:#007aff;
  color:#fff;
  border:1px solid #007aff;
}
.btn-primary:hover{
  background:#0077ed;
  border-color:#0077ed;
}
.btn-outline{
  background:transparent;
  border:1px solid #007aff;
  color:#007aff;
}
.btn-outline:hover{
  background:rgba(0,122,255,0.08);
}

/* ── 区块标题 ── */
.section-title{
  font-size:clamp(1.8rem,4vw,2.2rem);
  font-weight:500;
  margin-bottom:60px;
  letter-spacing:-0.01em;
  color:#1d1d1f;
}

/* ── 卡片 ── */
.project-list{
  display:grid;
  gap:48px;
}
.project-card{
  text-align:left;
  padding:40px;
  border-radius:20px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.06);
  transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.project-card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 40px rgba(0,0,0,0.08);
}
.project-card h3{
  font-size:1.5rem;
  font-weight:500;
  margin-bottom:12px;
  color:#1d1d1f;
}
.project-card p{
  color:#424245;
  line-height:1.7;
  margin-bottom:24px;
}
.project-link{
  color:#007aff;
  text-decoration:none;
  font-size:1rem;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:gap 0.2s ease;
}
.project-link:hover{
  text-decoration:underline;
  gap:10px;
}

footer{
  margin-top:120px;
  font-size:0.875rem;
  color:#86868b;
}

/* ── 动画 ── */
@keyframes softFade{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}
.hero,
.section-title,
.project-card{
  animation:softFade 0.8s ease-out both;
}

/* ── 焦点可见 ── */
:focus-visible{
  outline:3px solid rgba(0,102,204,0.45);
  outline-offset:3px;
  border-radius:999px;
}

/* ── 减少动画 ── */
@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}

/* ── 深色模式 ── */
@media (prefers-color-scheme: dark){
  body{background:#121214;color:#f5f5f7;}
  h1{color:#f5f5f7;}
  .subtitle{color:#a1a1a6;}
  .desc{color:#d1d1d6;}
  .section-title{color:#f5f5f7;}
  .project-card{background:#1e1e22;border-color:rgba(255,255,255,0.08);}
  .project-card h3{color:#f5f5f7;}
  .project-card p{color:#d1d1d6;}
  .btn-primary{background:#2997ff;border-color:#2997ff;color:#04121f;}
  .btn-primary:hover{background:#349cff;border-color:#349cff;}
  .btn-outline{border-color:#2997ff;color:#2997ff;}
  .btn-outline:hover{background:rgba(41,151,255,0.1);}
  .project-link{color:#2997ff;}
  footer{color:#86868b;}
}

/* ── 移动端 ── */
@media (max-width:640px){
  body{padding:24px 16px 48px;}
  .hero{margin-bottom:72px;}
  .section-title{margin-bottom:32px;}
  .project-card{padding:24px;border-radius:16px;}
  .btn-group{flex-direction:column;gap:12px;}
  .btn{width:100%;text-align:center;}
}
</style>
</head>
<body>

<div class="container">

  <!-- Hero -->
  <header class="hero">
    <h1>SLC.Leo</h1>
    <p class="subtitle">slcleo-usa.github.io</p>
    <p class="desc">
      Explore. Create. Iterate.<br>
      A minimalist static site hosted on GitHub Pages.
    </p>

    <div class="btn-group">
      <a class="btn btn-primary" href="mailto:godsunwyyx123spx@163.com">Email</a>
      <a class="btn btn-outline" href="https://github.com/SLCLeo-USA/SLC.Leo"
         target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </header>

  <!-- Our Program -->
  <h2 class="section-title" id="programs">Our Program</h2>
  <div class="project-list">

    <article class="project-card">
      <h3>Our Program</h3>
      <p>Browse all our programs, experiments and side projects in one place.</p>
      <a class="project-link"
         href="/list">View List →</a>
    </article>

  </div>

  <footer>© SLC.Leo 2026. All rights reserved.</footer>
</div>

</body>
</html>
