<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDR 3D 航迹阅读器 · LN-LAB</title>
<style>
  :root{
    --bg:#05080d;
    --card:rgba(15,22,34,.88);
    --ink:#e8eef7;
    --muted:#7f92aa;
    --line:rgba(90,120,160,.22);
    --accent:#5ab4ff;
    --accent-glow:rgba(90,180,255,.35);
    --danger:#ff4d4d;
    --warn:#ffc043;
    --ok:#3fe08a;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;display:block;touch-action:none;background:#05080d;cursor:grab}
  #scene:active{cursor:grabbing}

  #topbar{
    position:fixed; top:0; left:0; right:0; height:58px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; gap:14px; z-index:30;
    background:linear-gradient(180deg, rgba(5,8,13,.95), rgba(5,8,13,.55) 70%, transparent);
    border-bottom:1px solid rgba(90,180,255,.08);
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto}
  .brand{display:flex; align-items:center; gap:12px}
  .logo{
    width:34px;height:34px;border-radius:8px;flex:none;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#0f6fe0,#5ab4ff);
    color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.5px;
    box-shadow:0 4px 18px rgba(31,111,235,.5);
  }
  .brand h1{margin:0;font-size:15px;font-weight:700}
  .brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-top:1px}
  .actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

  .btn{
    appearance:none;border:1px solid var(--line);
    background:rgba(15,22,34,.88); color:var(--ink);
    padding:7px 13px;border-radius:6px;
    font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:.12s; backdrop-filter:blur(10px);
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(30,50,80,.9)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
  .btn.primary:hover{filter:brightness(1.15);color:#04121f;background:var(--accent)}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);background:rgba(60,20,25,.9)}

  #sidePanel{
    position:fixed; top:70px; right:14px; bottom:108px;
    width:290px; z-index:15;
    background:var(--card);
    backdrop-filter:blur(16px) saturate(160%);
    border:1px solid var(--line);
    border-radius:10px;
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.65);
    transition:transform .22s, opacity .22s;
  }
  #sidePanel.hidden{transform:translateX(340px);opacity:0;pointer-events:none}
  .panel-head{
    flex-shrink:0; padding:11px 14px 10px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, rgba(90,180,255,.06), transparent);
  }
  .panel-head h2{
    margin:0; font-size:10.5px; font-weight:700;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--muted);
    display:flex; align-items:center; gap:8px;
  }
  .panel-head h2::before{
    content:""; width:3px; height:12px; border-radius:2px;
    background:var(--accent); box-shadow:0 0 8px var(--accent-glow);
  }
  .panel-head .t{font-family:"SF Mono",Consolas,monospace;font-size:11px;color:var(--accent);font-weight:700}
  .panel-body{flex:1; overflow-y:auto; padding:8px 10px 12px}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:#243a52;border-radius:8px}

  .grp{margin-bottom:10px}
  .grp:last-child{margin-bottom:0}
  .grp-title{
    font-size:10px; font-weight:700; letter-spacing:.9px;
    color:var(--accent); text-transform:uppercase;
    padding:5px 6px 4px; opacity:.85;
  }
  .p-row{
    display:grid; grid-template-columns:minmax(0,1fr) auto;
    gap:8px; align-items:center;
    padding:4px 6px 4px 18px; border-radius:5px;
    transition:.12s; position:relative;
  }
  .p-row .pn{
    font-size:11.5px; color:#c8d5e6;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .p-row .pv{
    font-family:"SF Mono",Consolas,monospace;
    font-size:11.5px; font-weight:700;
    color:var(--accent); white-space:nowrap;
  }
  .p-row .pv .u{color:var(--muted);font-weight:500;font-size:10px;margin-left:3px}
  .p-row.alarm{background:rgba(255,77,77,.16); animation:pulseBg 1.1s ease-in-out infinite}
  .p-row.alarm .pn{color:#ffb0b0}
  .p-row.alarm .pv{color:#ff6b6b}
  .p-row.alarm .pv .u{color:#ffb0b0}
  .p-row.alarm::before{
    content:"⚠"; position:absolute; left:4px; top:50%;
    transform:translateY(-50%); color:#ff5555; font-size:11px;
  }
  @keyframes pulseBg{0%,100%{background:rgba(255,77,77,.16)} 50%{background:rgba(255,77,77,.3)}}

  #hudLeft{
    position:fixed; left:14px; bottom:108px; z-index:15;
    display:flex; gap:10px; align-items:stretch; height:190px;
  }
  #adiBox{
    width:190px; height:190px;
    border-radius:12px;
    background:var(--card);
    backdrop-filter:blur(16px);
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.65);
    padding:8px; display:flex; flex-direction:column; flex-shrink:0;
  }
  #adi{display:block;width:100%;flex:1}
  #adiLabel{
    flex-shrink:0; font-size:9.5px; color:var(--muted);
    text-align:center; letter-spacing:1.2px; text-transform:uppercase;
    padding-top:2px; font-weight:700;
  }
  #keyStatus{
    width:180px; height:190px;
    border-radius:12px;
    background:var(--card);
    backdrop-filter:blur(16px);
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.65);
    padding:9px 10px; display:flex; flex-direction:column;
    overflow:hidden; flex-shrink:0;
  }
  .ks-title{
    flex-shrink:0; font-size:9.5px; color:var(--muted); font-weight:700;
    letter-spacing:1.2px; text-transform:uppercase;
    padding-bottom:6px; margin-bottom:6px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:6px;
  }
  .ks-title::before{
    content:""; width:3px; height:10px; border-radius:2px;
    background:var(--accent); box-shadow:0 0 6px var(--accent-glow);
  }
  .ks-body{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px}
  .ks-body::-webkit-scrollbar{width:4px}
  .ks-body::-webkit-scrollbar-thumb{background:#243a52;border-radius:8px}
  .ks-row{
    display:grid; grid-template-columns:minmax(0,1fr) auto;
    gap:6px; align-items:center;
    padding:3px 5px; border-radius:4px;
    font-size:11px; transition:.15s;
  }
  .ks-row .ks-k{
    color:#9fb4d0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ks-row .ks-v{
    font-family:"SF Mono",Consolas,monospace;
    font-weight:700; font-size:11px;
    color:var(--accent); white-space:nowrap;
  }
  .ks-row.warn{background:rgba(255,192,67,.16); animation:pulseWarn 1.2s ease-in-out infinite}
  .ks-row.warn .ks-k{color:#ffd97a}
  .ks-row.warn .ks-v{color:var(--warn)}
  .ks-row.alarm{background:rgba(255,77,77,.2); animation:pulseAlarm .9s ease-in-out infinite}
  .ks-row.alarm .ks-k{color:#ffb0b0}
  .ks-row.alarm .ks-v{color:var(--danger)}
  .ks-row.ok .ks-v{color:var(--ok)}
  .ks-row.idle .ks-v{color:var(--muted)}
  @keyframes pulseWarn{0%,100%{background:rgba(255,192,67,.16)} 50%{background:rgba(255,192,67,.3)}}
  @keyframes pulseAlarm{0%,100%{background:rgba(255,77,77,.2)} 50%{background:rgba(255,77,77,.4)}}

  #bottomBar{
    position:fixed; left:0; right:0; bottom:0; height:88px; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:0 20px;
    background:linear-gradient(0deg, rgba(5,8,13,.98), rgba(5,8,13,.85) 70%, transparent);
    pointer-events:none;
  }
  #bottomBar > *{pointer-events:auto}

  .time-badge{
    flex-shrink:0;
    background:rgba(15,22,34,.9);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 14px;
    font-family:"SF Mono",Consolas,monospace;
    backdrop-filter:blur(10px);
    min-width:130px;
  }
  .time-badge .lbl{
    font-size:9px; color:var(--muted); letter-spacing:.9px;
    text-transform:uppercase; font-weight:700;
  }
  .time-badge .v{
    font-size:18px; font-weight:700; color:var(--accent);
    letter-spacing:.5px;
    text-shadow:0 0 12px var(--accent-glow);
  }

  .nav{display:flex;gap:4px;flex-shrink:0}
  .navbtn{
    width:36px;height:36px;border-radius:7px;
    border:1px solid var(--line);background:rgba(15,22,34,.9);
    color:var(--ink);cursor:pointer;
    display:grid;place-items:center;
    font-size:12px;font-family:inherit;
    transition:.12s;backdrop-filter:blur(10px);
    padding:0;
  }
  .navbtn:hover{border-color:var(--accent);color:var(--accent);background:rgba(30,50,80,.9)}
  .navbtn.play{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:700}
  .navbtn.play:hover{filter:brightness(1.15);color:#04121f}

  .slider-wrap{flex:1; min-width:0; display:flex; align-items:center; gap:10px}
  .slider{
    flex:1; -webkit-appearance:none; appearance:none;
    height:6px; border-radius:3px;
    background:linear-gradient(90deg, #0f6fe0 0%, #5ab4ff var(--p,0%), #1a2636 var(--p,0%), #1a2636 100%);
    outline:none; cursor:pointer;
  }
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px;height:16px;
    border-radius:50%;background:#fff;
    border:3px solid var(--accent);
    box-shadow:0 0 0 3px rgba(90,180,255,.28), 0 0 14px rgba(90,180,255,.6);
    cursor:pointer; transition:.12s;
  }
  .slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
  .slider::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;
    border:3px solid var(--accent);cursor:pointer;
  }

  .speed-wrap{
    display:flex; align-items:center; gap:6px;
    background:rgba(15,22,34,.9);
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 10px 4px 12px;
    flex-shrink:0;
  }
  .speed-wrap .sl{font-size:9px;color:var(--muted);letter-spacing:.7px;font-weight:700}
  #playSpeed{
    appearance:none; -webkit-appearance:none;
    background:transparent; color:var(--accent);
    border:none; outline:none; cursor:pointer;
    font-family:"SF Mono",Consolas,monospace;
    font-size:12.5px; font-weight:700;
    padding:2px 4px;
  }
  #playSpeed option{background:#0f1622;color:var(--ink)}

  .aux{display:flex;gap:6px;flex-shrink:0}
  .aux .btn{padding:7px 11px;font-size:11.5px}

  .credit{
    position:fixed; right:14px; bottom:76px; z-index:12;
    font-family:"SF Mono",Consolas,monospace;
    font-size:10px; letter-spacing:1.1px;
    color:var(--muted);
    opacity:.7;
    pointer-events:none; user-select:none;
    text-align:right; line-height:1.5;
  }
  .credit b{color:var(--accent); font-weight:700; opacity:.95}
  .credit .sm{font-size:9px;opacity:.65;letter-spacing:.6px}

  #hint{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    z-index:12;
    background:rgba(15,22,34,.75);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 16px;
    font-size:11px;
    color:var(--muted);
    backdrop-filter:blur(10px);
    letter-spacing:.3px;
    pointer-events:none;
    transition:opacity .5s;
    white-space:nowrap;
  }
  #hint kbd{
    font-family:"SF Mono",Consolas,monospace;
    background:rgba(90,180,255,.15);
    color:var(--accent);
    border-radius:3px;
    padding:1px 5px;
    font-size:10px;
    margin:0 2px;
    font-weight:700;
  }

  #overlay{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(15,30,55,.92), rgba(5,8,13,.97));
    backdrop-filter:blur(12px);
    transition:opacity .3s;
  }
  #overlay.hide{opacity:0;pointer-events:none}
  .overlay-card{
    background:rgba(15,22,34,.95); border:1px solid var(--line);
    border-radius:16px; padding:36px 44px;
    text-align:center; max-width:480px;
    box-shadow:0 24px 80px rgba(0,0,0,.85);
  }
  .overlay-card h2{
    margin:0 0 10px; font-size:20px; font-weight:700;
    background:linear-gradient(135deg,#5ab4ff,#0f6fe0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay-card p{
    margin:0 0 22px; font-size:13px; color:var(--muted);
    line-height:1.7;
  }
  .overlay-card .hint{
    font-size:11.5px;color:#5a6d85;margin-top:16px;line-height:1.7;
  }
  .overlay-card .err{
    color:var(--danger); background:rgba(255,77,77,.12);
    border:1px solid rgba(255,77,77,.35);
    border-radius:7px; padding:11px 14px;
    font-size:12px; margin-top:16px; line-height:1.6;
    text-align:left;
  }

  #toast{
    position:fixed; left:50%; top:76px; transform:translate(-50%,-16px);
    background:#0f1622; color:#fff; padding:11px 22px; border-radius:8px;
    font-size:12.5px; font-weight:500; z-index:300; opacity:0;
    transition:.25s cubic-bezier(.2,.9,.3,1.2); pointer-events:none;
    box-shadow:0 14px 40px rgba(0,0,0,.7);
    border:1px solid rgba(90,180,255,.25);
    max-width:80vw;
  }
  #toast.show{transform:translate(-50%,0); opacity:1}
  #toast.err{background:#2a0e12;border-color:rgba(255,77,77,.5);color:#ffb0b0}
  #toast.ok{background:#0a2818;border-color:rgba(63,224,138,.5);color:#9effc6}

  @media (max-width:1024px){
    #sidePanel{width:250px}
    #hudLeft{height:160px}
    #adiBox{width:160px;height:160px}
    #keyStatus{width:150px;height:160px;padding:7px 8px}
    .ks-row{font-size:10.5px;padding:2px 4px}
    .credit{bottom:76px;font-size:9px}
    #hint{font-size:10px}
  }
  @media (max-width:720px){
    #sidePanel{display:none}
    #hudLeft{height:130px;bottom:98px}
    #adiBox{width:130px;height:130px}
    #keyStatus{width:130px;height:130px}
    .brand h1{font-size:13px}
    .brand .sub{display:none}
    .time-badge{min-width:0;padding:5px 9px}
    .time-badge .v{font-size:14px}
    .credit{right:10px;bottom:88px}
    #hint{display:none}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="topbar">
  <div class="brand">
    <div class="logo">3D</div>
    <div>
      <h1>FDR 3D 航迹阅读器</h1>
      <div class="sub" id="flightInfo">正在加载…</div>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="btnPlaceRunway" title="在当前时间点的位置和方向放置跑道">🛬 放置跑道</button>
    <button class="btn danger" id="btnClearRunway" title="清除跑道">✕</button>
    <button class="btn" id="btnTogglePanel">☰ 面板</button>
    <button class="btn primary" id="btnOpen">📂 打开 LNFDR</button>
  </div>
</div>

<aside id="sidePanel">
  <div class="panel-head">
    <h2>实时参数</h2>
    <span class="t" id="panelTime">T+0.0s</span>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div id="hudLeft">
  <div id="adiBox">
    <canvas id="adi" width="320" height="320"></canvas>
    <div id="adiLabel">ATTITUDE</div>
  </div>
  <div id="keyStatus">
    <div class="ks-title">关键状态</div>
    <div class="ks-body" id="ksBody"></div>
  </div>
</div>

<div id="bottomBar">
  <div class="time-badge">
    <div class="lbl">TIME</div>
    <div class="v" id="timeVal">0.0s</div>
  </div>
  <div class="nav">
    <button class="navbtn" id="btnPrev" title="上一步 (←)">◀</button>
    <button class="navbtn play" id="btnPlay" title="播放/暂停 (空格)">▶</button>
    <button class="navbtn" id="btnNext" title="下一步 (→)">▶</button>
  </div>
  <div class="slider-wrap">
    <input type="range" class="slider" id="timeSlider" min="0" max="119" value="0" step="0.01">
  </div>
  <div class="speed-wrap">
    <span class="sl">SPEED</span>
    <select id="playSpeed" title="播放倍速">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="8" selected>8×</option>
      <option value="16">16×</option>
      <option value="30">30×</option>
      <option value="60">60×</option>
    </select>
  </div>
  <div class="aux">
    <button class="btn" id="btnFollow" title="锁定/解锁跟随">◎ 跟随</button>
    <button class="btn" id="btnTrail" title="显示/隐藏航迹">〰 航迹</button>
  </div>
</div>

<div id="hint">
  <kbd>左键</kbd>旋转 <kbd>右键</kbd>平移 <kbd>滚轮</kbd>缩放 · <kbd>空格</kbd>播放 · 选中时间点后点<kbd>🛬 放置跑道</kbd>
</div>

<div class="credit">
  <b>LN-LAB</b> · Photaxis-Lab<br>
  <span class="sm">FDR 3D Reader v4.1</span>
</div>

<div id="overlay">
  <div class="overlay-card">
    <h2>FDR 3D 航迹阅读器</h2>
    <p>打开一个 <b>.LNFDR</b> 文件，即可将飞行数据以 3D 航迹方式回放。<br>内置示例已自动加载。</p>
    <button class="btn primary" id="btnOverlayOpen" style="padding:11px 26px;font-size:13.5px">📂 打开 LNFDR 文件</button>
    <div class="hint">
      支持导出器生成的 LNFDR v1–v3 格式<br>
      ← → 切换 · 空格播放 · 左键旋转 · 右键平移 · 滚轮缩放
    </div>
    <div class="err" id="overlayErr" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<input type="file" id="fileInput" accept=".lnfdr,.LNFDR,.json,application/json"
       style="position:fixed;left:-10000px;top:-10000px;opacity:0;pointer-events:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =========================================================
   状态
   ========================================================= */
var state = {
  N: 0, t0: 0, t1: 0, span: 1,
  cursorFloat: 0,
  cursorIdx: 0,
  playing: false, playRAF: null,
  playSpeed: 8,
  path: [], pathRotation: 0,
  keyParams: {}, paramMap: {}, allGroups: [],
  follow: true, showTrail: true,
  ready: false,
  smoothTarget: null,
  panOffset: null,
  camSpherical: { radius: 320, theta: Math.PI * 0.25, phi: Math.PI * 0.36 }
};

var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };

var toastTimer = null;
function toast(msg, type){
  var el = $('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = ''; }, 2400);
}

function fmtNum(v){
  if (!isFinite(v)) return '—';
  var a = Math.abs(v);
  if (a >= 1000)  return v.toFixed(0);
  if (a >= 100)   return v.toFixed(1);
  if (a >= 1)     return v.toFixed(2);
  return v.toFixed(3);
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function findParam(groups, keys){
  for (var i = 0; i < groups.length; i++){
    var ps = groups[i].parameters || [];
    for (var j = 0; j < ps.length; j++){
      var n = String(ps[j].name || '').toLowerCase();
      for (var k = 0; k < keys.length; k++){
        if (n.indexOf(keys[k].toLowerCase()) >= 0) return ps[j];
      }
    }
  }
  return null;
}

/* ---- 跑道组（局部：从原点向 -Z 延伸） ---- */
function buildRunwayGroup(){
  var group = new THREE.Group();
  var runwayW = 60, runwayL = 3200;

  var runwayMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(runwayW, runwayL),
    new THREE.MeshLambertMaterial({ color: RUNWAY_COL })
  );
  runwayMesh.rotation.x = -Math.PI / 2;
  runwayMesh.position.set(0, 0.1, -runwayL / 2);
  group.add(runwayMesh);

  var edgeMat = new THREE.MeshBasicMaterial({ color: 0x3a6a9a, transparent: true, opacity: 0.85 });
  var edgeGeo = new THREE.PlaneGeometry(2.5, runwayL * 0.98);
  var edgeL = new THREE.Mesh(edgeGeo, edgeMat);
  edgeL.rotation.x = -Math.PI / 2;
  edgeL.position.set(-runwayW / 2 + 2, 0.15, -runwayL / 2);
  group.add(edgeL);
  var edgeR = edgeL.clone();
  edgeR.position.x = runwayW / 2 - 2;
  group.add(edgeR);

  var centerMat = new THREE.MeshBasicMaterial({ color: 0xaad8ff, transparent: true, opacity: 0.9 });
  var centerGeo = new THREE.PlaneGeometry(1.2, runwayL * 0.95);
  var centerLine = new THREE.Mesh(centerGeo, centerMat);
  centerLine.rotation.x = -Math.PI / 2;
  centerLine.position.set(0, 0.22, -runwayL / 2);
  group.add(centerLine);

  var markMat = new THREE.MeshBasicMaterial({ color: 0x7aa8d0, transparent: true, opacity: 0.7 });
  for (var i = 0; i < 8; i++){
    var sGeo = new THREE.PlaneGeometry(3.5, 40);
    var sL = new THREE.Mesh(sGeo, markMat);
    sL.rotation.x = -Math.PI / 2;
    sL.position.set(-11, 0.18, -120 - Math.floor(i / 2) * 90);
    group.add(sL);
    var sR = sL.clone();
    sR.position.x = 11;
    group.add(sR);
  }

  for (var j = 0; j < 6; j++){
    var tGeo = new THREE.PlaneGeometry(4, 30);
    var t = new THREE.Mesh(tGeo, markMat);
    t.rotation.x = -Math.PI / 2;
    t.position.set(-24 + j * 9.6, 0.2, -30);
    group.add(t);
  }

  return group;
}

function clearRunway(){
  if (!runwayGroup) return;
  scene.remove(runwayGroup);
  runwayGroup.traverse(function(obj){
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material){
      if (Array.isArray(obj.material)) obj.material.forEach(function(m){ m.dispose(); });
      else obj.material.dispose();
    }
  });
  runwayGroup = null;
}

/* ---- 在当前时间点位置和方向放置跑道 ---- */
function placeRunwayAtCursor(){
  if (!state.ready || !state.path || state.path.length < 2){
    toast('尚未加载航迹', 'err');
    return;
  }
  clearRunway();

  var cf = clamp(state.cursorFloat, 0, state.N - 1);
  var i0 = Math.floor(cf);
  var i1 = Math.min(i0 + 1, state.N - 1);
  var f = cf - i0;

  var p0 = state.path[i0], p1 = state.path[i1];
  var px = p0.x + (p1.x - p0.x) * f;
  var pz = p0.z + (p1.z - p0.z) * f;

  // 位置贴地
  var pos = new THREE.Vector3(px, 0, pz);

  // 切线方向（水平）
  var prevIdx = Math.max(0, i0 - 2);
  var nextIdx = Math.min(state.path.length - 1, i1 + 2);
  var dir = _tmpV1.subVectors(state.path[nextIdx], state.path[prevIdx]);
  dir.y = 0;
  if (dir.lengthSq() < 0.001) dir.set(0, 0, -1);
  dir.normalize();

  // yaw: 让 group 的 -Z 对齐 dir
  var yaw = Math.atan2(-dir.x, -dir.z);

  runwayGroup = buildRunwayGroup();
  runwayGroup.position.copy(pos);
  runwayGroup.rotation.y = yaw;
  scene.add(runwayGroup);

  var t = state.t0 + state.span * cf / Math.max(1, state.N - 1);
  toast('跑道已放置于 T+' + t.toFixed(1) + 's 位置', 'ok');
}

/* ---- 航迹 ---- */
function buildTrail(){
  var N = Math.max(2, state.N || 120);
  var lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  lineGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  lineGeo.setDrawRange(0, 0);
  var lineMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85 });
  trailLine = new THREE.Line(lineGeo, lineMat);
  trailLine.visible = false;
  scene.add(trailLine);
}

function rebuildTrailTube(){
  if (trailMesh){
    scene.remove(trailMesh);
    trailMesh.geometry.dispose();
    trailMesh.material.dispose();
    trailMesh = null;
  }
  if (!state.path || state.path.length < 2) return;

  var pts = state.path;
  var step = Math.max(1, Math.floor(pts.length / 200));
  var sampled = [];
  for (var i = 0; i < pts.length; i += step) sampled.push(pts[i]);
  if (sampled[sampled.length - 1] !== pts[pts.length - 1]) sampled.push(pts[pts.length - 1]);
  if (sampled.length < 2) return;

  var curve = new THREE.CatmullRomCurve3(sampled);
  var tubeRadius = 4.5;
  var tubularSegments = Math.min(800, Math.max(80, sampled.length * 2));
  var tubeGeo = new THREE.TubeGeometry(curve, tubularSegments, tubeRadius, 6, false);

  var altMin = Infinity, altMax = -Infinity;
  for (var j = 0; j < pts.length; j++){
    if (pts[j].y < altMin) altMin = pts[j].y;
    if (pts[j].y > altMax) altMax = pts[j].y;
  }
  var range = Math.max(1, altMax - altMin);

  var posAttr = tubeGeo.attributes.position;
  var colors = new Float32Array(posAttr.count * 3);
  var c = new THREE.Color();
  for (var k = 0; k < posAttr.count; k++){
    var y = posAttr.getY(k);
    var u = (y - altMin) / range;
    c.setHSL(0.02 + u * 0.58, 0.9, 0.5 + u * 0.1);
    colors[k * 3] = c.r;
    colors[k * 3 + 1] = c.g;
    colors[k * 3 + 2] = c.b;
  }
  tubeGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  trailMesh = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.92
  }));
  scene.add(trailMesh);
}

function updateTrailDraw(){
  if (trailMesh) trailMesh.visible = state.showTrail;
  if (trailLine) trailLine.visible = false;
}

/* =========================================================
   LNFDR 加载
   ========================================================= */
function loadLNFDR(data){
  if (!data || typeof data !== 'object') throw new Error('文件内容不是有效对象');
  if (data.format !== 'LNFDR') throw new Error('缺少 format:"LNFDR" 标识');

  var tl = data.timeline || {};
  state.t0 = Number(tl.start) || 0;
  state.t1 = Number(tl.end) || 180;

  var groups = data.groups || [];
  if (!groups.length) throw new Error('文件中没有参数分组');

  var sampleCount = Number(tl.samples) || 0;
  if (!sampleCount){
    for (var i = 0; i < groups.length; i++){
      var ps = groups[i].parameters || [];
      for (var j = 0; j < ps.length; j++){
        if (Array.isArray(ps[j].series) && ps[j].series.length){
          sampleCount = ps[j].series.length; break;
        }
      }
      if (sampleCount) break;
    }
  }
  state.N = Math.max(2, sampleCount || 120);
  state.span = Math.max(0.001, state.t1 - state.t0);

  state.paramMap = {};
  state.allGroups = groups;
  groups.forEach(function(g){
    (g.parameters || []).forEach(function(p){ state.paramMap[p.name] = p; });
  });

  state.keyParams = {
    altitude: findParam(groups, ['气压高度', '高度', 'altitude']),
    speed:    findParam(groups, ['指示空速', '空速', 'airspeed', 'speed']),
    heading:  findParam(groups, ['航向', 'heading']),
    pitch:    findParam(groups, ['俯仰']),
    roll:     findParam(groups, ['滚转']),
    gear:     findParam(groups, ['起落架', 'gear']),
    flap:     findParam(groups, ['后缘襟翼', '襟翼', 'flap']),
    slat:     findParam(groups, ['前缘缝翼', '缝翼', 'slat']),
    spoiler:  findParam(groups, ['地面扰流板', '扰流板', 'spoiler']),
    airgnd:   findParam(groups, ['空 / 地', '空/地']),
    ap:       findParam(groups, ['自动驾驶仪接通', '自动驾驶']),
    athr:     findParam(groups, ['自动油门模式', '自动油门']),
    afmode:   findParam(groups, ['自动飞行模式', '飞行模式']),
    gpws:     findParam(groups, ['近地警告', 'GPWS']),
    stall:    findParam(groups, ['失速警告', 'STALL']),
    ws:       findParam(groups, ['风切变']),
    config:   findParam(groups, ['构型警告']),
    overspd:  findParam(groups, ['超速警告']),
    tcas:     findParam(groups, ['TCAS']),
    master:   findParam(groups, ['主警告'])
  };

  computePath();

  if (trailLine){
    scene.remove(trailLine);
    trailLine.geometry.dispose();
    trailLine.material.dispose();
    trailLine = null;
  }
  if (trailMesh){
    scene.remove(trailMesh);
    trailMesh.geometry.dispose();
    trailMesh.material.dispose();
    trailMesh = null;
  }
  buildTrail();
  rebuildTrailTube();
  updateTrailDraw();

  // 加载新文件时清除旧跑道（路径变了）
  clearRunway();

  state.cursorFloat = (state.N - 1) / 2;
  state.cursorIdx = Math.round(state.cursorFloat);
  state.ready = true;

  var p = state.path[state.cursorIdx];
  state.smoothTarget.copy(p);
  state.panOffset.set(0, 0, 0);

  var meta = data.meta || {};
  var parts = [];
  if (meta.aircraftType) parts.push(meta.aircraftType);
  if (meta.tailNumber)   parts.push(meta.tailNumber);
  if (meta.flightNumber) parts.push(meta.flightNumber);
  if (meta.date)         parts.push(meta.date);
  $('flightInfo').textContent = parts.join('  ·  ') || '未命名飞行';

  renderParamPanel();
  renderKeyStatus();

  var slider = $('timeSlider');
  slider.min = 0;
  slider.max = state.N - 1;
  slider.value = state.cursorFloat;

  applyCursor();
  $('overlay').classList.add('hide');
  toast('已加载：' + (meta.flightNumber || meta.tailNumber || '未命名'), 'ok');
}

/* =========================================================
   计算 3D 路径
   ========================================================= */
function computePath(){
  var N = state.N;
  var dt = state.span / Math.max(1, N - 1);

  var altP = state.keyParams.altitude;
  var spdP = state.keyParams.speed;
  var hdgP = state.keyParams.heading;

  var altSeries = (altP && altP.series) ? altP.series : new Array(N).fill(0);
  var spdSeries = (spdP && spdP.series) ? spdP.series : new Array(N).fill(120);
  var hdgSeries = (hdgP && hdgP.series) ? hdgP.series : new Array(N).fill(0);

  function get(arr, i){ var v = arr[i]; return isFinite(v) ? v : 0; }

  var pts = [ new THREE.Vector3(0, get(altSeries, 0) * 0.3048, 0) ];
  var x = 0, z = 0;

  for (var i = 1; i < N; i++){
    var hdg = ((get(hdgSeries, i-1) + get(hdgSeries, i)) / 2) * Math.PI / 180;
    var spd = ((get(spdSeries, i-1) + get(spdSeries, i)) / 2) * 0.51444;
    x += Math.sin(hdg) * spd * dt;
    z -= Math.cos(hdg) * spd * dt;
    pts.push(new THREE.Vector3(x, get(altSeries, i) * 0.3048, z));
  }

  var last = pts[pts.length - 1];
  pts.forEach(function(p){ p.x -= last.x; p.y -= last.y; p.z -= last.z; });

  var p0 = pts[Math.max(0, N - 12)];
  var p1 = pts[N - 1];
  var dx = p1.x - p0.x;
  var dz = p1.z - p0.z;
  var theta = Math.atan2(dx, -dz);
  state.pathRotation = theta;

  var cosT = Math.cos(theta), sinT = Math.sin(theta);
  pts.forEach(function(p){
    var nx = p.x * cosT + p.z * sinT;
    var nz = -p.x * sinT + p.z * cosT;
    p.x = nx; p.z = nz;
  });

  state.path = pts;
}

function interpPath(i0, i1, f){
  var p0 = state.path[i0], p1 = state.path[i1];
  return {
    x: p0.x + (p1.x - p0.x) * f,
    y: p0.y + (p1.y - p0.y) * f,
    z: p0.z + (p1.z - p0.z) * f
  };
}
function interpSeries(series, i0, i1, f){
  if (!series) return 0;
  var v0 = isFinite(series[i0]) ? series[i0] : 0;
  var v1 = isFinite(series[i1]) ? series[i1] : 0;
  return v0 + (v1 - v0) * f;
}

/* =========================================================
   姿态仪
   ========================================================= */
function drawADI(){
  var cvs = $('adi');
  if (!cvs) return;
  var ctx = cvs.getContext('2d');
  var W = cvs.width, H = cvs.height;
  var cx = W / 2, cy = H / 2;
  var R = Math.min(W, H) / 2 - 8;

  var pitchP = state.keyParams.pitch;
  var rollP = state.keyParams.roll;
  var pitch = 0, roll = 0;
  if (pitchP && pitchP.series) pitch = pitchP.series[state.cursorIdx] || 0;
  if (rollP && rollP.series)  roll  = rollP.series[state.cursorIdx] || 0;

  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.clip();
  ctx.translate(cx, cy);
  ctx.rotate(-roll * Math.PI / 180);

  var pxPerDeg = R / 30;
  var pitchOffset = -pitch * pxPerDeg;

  var skyGrad = ctx.createLinearGradient(0, -R * 4, 0, pitchOffset);
  skyGrad.addColorStop(0, '#0a2a52');
  skyGrad.addColorStop(1, '#2a7ac8');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-R * 4, -R * 4, R * 8, R * 4 + pitchOffset);

  var groundGrad = ctx.createLinearGradient(0, pitchOffset, 0, R * 4);
  groundGrad.addColorStop(0, '#7a5228');
  groundGrad.addColorStop(1, '#3a2208');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(-R * 4, pitchOffset, R * 8, R * 4);

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-R * 2, pitchOffset);
  ctx.lineTo(R * 2, pitchOffset);
  ctx.stroke();

  ctx.font = '700 11px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var d = -30; d <= 30; d += 5){
    if (d === 0) continue;
    var y = pitchOffset - d * pxPerDeg;
    var w = (Math.abs(d) % 10 === 0) ? 42 : 22;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-w, y); ctx.lineTo(w, y);
    ctx.stroke();
    if (Math.abs(d) % 10 === 0){
      ctx.fillStyle = '#ffffff';
      ctx.fillText(Math.abs(d), -w - 5, y);
      ctx.textAlign = 'left';
      ctx.fillText(Math.abs(d), w + 5, y);
      ctx.textAlign = 'right';
    }
  }
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);

  ctx.fillStyle = '#ffb000';
  ctx.beginPath();
  ctx.moveTo(0, -R + 2);
  ctx.lineTo(-8, -R + 14);
  ctx.lineTo(8, -R + 14);
  ctx.closePath(); ctx.fill();

  var rollMarks = [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60];
  ctx.strokeStyle = '#ffffff';
  rollMarks.forEach(function(a){
    var rad = (a - 90) * Math.PI / 180;
    var r1 = R - 2;
    var r2 = R - (Math.abs(a) % 30 === 0 ? 14 : (Math.abs(a) % 10 === 0 ? 10 : 6));
    ctx.lineWidth = (a === 0) ? 2.5 : 1.4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(rad) * r1, Math.sin(rad) * r1);
    ctx.lineTo(Math.cos(rad) * r2, Math.sin(rad) * r2);
    ctx.stroke();
  });

  ctx.rotate(roll * Math.PI / 180);
  ctx.fillStyle = '#ffb000';
  ctx.beginPath();
  ctx.moveTo(0, -R + 8);
  ctx.lineTo(-6, -R + 2);
  ctx.lineTo(6, -R + 2);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = '#ffb000';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-R * 0.42, 0); ctx.lineTo(-R * 0.18, 0);
  ctx.moveTo(R * 0.18, 0);  ctx.lineTo(R * 0.42, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-R * 0.05, 0); ctx.lineTo(0, R * 0.12); ctx.lineTo(R * 0.05, 0);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#5ab4ff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(90,180,255,.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, R - 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/* =========================================================
   应用光标
   ========================================================= */
function applyCursor(){
  if (!state.ready) return;

  var cf = clamp(state.cursorFloat, 0, state.N - 1);
  var i0 = Math.floor(cf);
  var i1 = Math.min(i0 + 1, state.N - 1);
  var f = cf - i0;

  var pos = interpPath(i0, i1, f);

  if (aircraft){
    aircraft.position.set(pos.x, pos.y, pos.z);

    var hdgP = state.keyParams.heading;
    var pitchP = state.keyParams.pitch;
    var rollP = state.keyParams.roll;

    var rawHdg = interpSeries(hdgP && hdgP.series, i0, i1, f);
    var hdgDeg = rawHdg - state.pathRotation * 180 / Math.PI;
    var pitch = interpSeries(pitchP && pitchP.series, i0, i1, f);
    var roll = interpSeries(rollP && rollP.series, i0, i1, f);

    var hdgRad = hdgDeg * Math.PI / 180;
    var pitchRad = pitch * Math.PI / 180;
    var rollRad = roll * Math.PI / 180;

    _tmpQ1.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -rollRad);
    _tmpQ2.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -pitchRad);
    _tmpQ3.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI - hdgRad);
    aircraft.quaternion.copy(_tmpQ3).multiply(_tmpQ2).multiply(_tmpQ1);
  }

  state.cursorIdx = Math.round(cf);

  updateTrailDraw();
  updateParamPanel();
  updateKeyStatus();
  drawADI();

  var t = state.t0 + state.span * cf / Math.max(1, state.N - 1);
  $('timeVal').textContent = t.toFixed(1) + 's';

  var slider = $('timeSlider');
  if (document.activeElement !== slider) slider.value = cf;
  var pct = (cf / Math.max(1, state.N - 1)) * 100;
  slider.style.setProperty('--p', pct + '%');
}

/* =========================================================
   相机
   ========================================================= */
var isRotating = false, isPanning = false;
var lastMouse = { x: 0, y: 0 };

function bindCameraControls(){
  var cvs = $('scene');

  cvs.addEventListener('pointerdown', function(e){
    if (e.button === 2){
      isPanning = true;
      lastMouse.x = e.clientX; lastMouse.y = e.clientY;
      try { cvs.setPointerCapture(e.pointerId); } catch(_){}
      e.preventDefault();
    } else if (e.button === 0){
      isRotating = true;
      lastMouse.x = e.clientX; lastMouse.y = e.clientY;
      try { cvs.setPointerCapture(e.pointerId); } catch(_){}
    }
  });

  cvs.addEventListener('pointermove', function(e){
    if (isRotating){
      var dx = e.clientX - lastMouse.x;
      var dy = e.clientY - lastMouse.y;
      lastMouse.x = e.clientX; lastMouse.y = e.clientY;
      state.camSpherical.theta -= dx * 0.005;
      state.camSpherical.phi   -= dy * 0.005;
      state.camSpherical.phi = clamp(state.camSpherical.phi, 0.08, Math.PI * 0.92);
    } else if (isPanning){
      var pdx = e.clientX - lastMouse.x;
      var pdy = e.clientY - lastMouse.y;
      lastMouse.x = e.clientX; lastMouse.y = e.clientY;

      var worldPerPixel = (2 * state.camSpherical.radius *
        Math.tan(camera.fov * Math.PI / 360)) / window.innerHeight;

      var right = _tmpV1.setFromMatrixColumn(camera.matrixWorld, 0);
      var up = _tmpV2.setFromMatrixColumn(camera.matrixWorld, 1);

      state.panOffset.addScaledVector(right, -pdx * worldPerPixel);
      state.panOffset.addScaledVector(up, pdy * worldPerPixel);
    }
  });

  cvs.addEventListener('pointerup', function(e){
    if (e.button === 2) isPanning = false;
    else if (e.button === 0) isRotating = false;
    try { cvs.releasePointerCapture(e.pointerId); } catch(_){}
  });

  cvs.addEventListener('pointercancel', function(){
    isRotating = false; isPanning = false;
  });

  cvs.addEventListener('wheel', function(e){
    e.preventDefault();
    var delta = Math.sign(e.deltaY);
    state.camSpherical.radius *= (1 + delta * 0.11);
    state.camSpherical.radius = clamp(state.camSpherical.radius, 25, 6000);
  }, { passive: false });

  cvs.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  cvs.addEventListener('dblclick', function(){
    state.panOffset.set(0, 0, 0);
    toast('视角已复位', 'ok');
  });
}

/* =========================================================
   渲染循环
   ========================================================= */
var animLastTime = performance.now();

function animate(){
  requestAnimationFrame(animate);
  if (!renderer || !scene || !camera) return;

  var now = performance.now();
  var dt = Math.min(0.1, (now - animLastTime) / 1000);
  animLastTime = now;

  if (!state.ready){
    renderer.render(scene, camera);
    return;
  }

  var desired = _tmpV1.set(0, 0, 0);
  if (state.follow){
    var cf = clamp(state.cursorFloat, 0, state.N - 1);
    var i0 = Math.floor(cf);
    var i1 = Math.min(i0 + 1, state.N - 1);
    var f = cf - i0;
    var p0 = state.path[i0], p1 = state.path[i1];
    desired.set(
      p0.x + (p1.x - p0.x) * f,
      p0.y + (p1.y - p0.y) * f,
      p0.z + (p1.z - p0.z) * f
    );
    desired.add(state.panOffset);
  } else {
    desired.copy(state.smoothTarget);
  }

  var alpha = 1 - Math.exp(-dt / 0.15);
  var dist = desired.distanceTo(state.smoothTarget);
  if (dist > 2000){
    state.smoothTarget.copy(desired);
  } else {
    state.smoothTarget.x += (desired.x - state.smoothTarget.x) * alpha;
    state.smoothTarget.y += (desired.y - state.smoothTarget.y) * alpha;
    state.smoothTarget.z += (desired.z - state.smoothTarget.z) * alpha;
  }

  var sp = state.camSpherical;
  var sinPhi = Math.sin(sp.phi);
  camera.position.set(
    state.smoothTarget.x + sinPhi * Math.sin(sp.theta) * sp.radius,
    state.smoothTarget.y + Math.cos(sp.phi) * sp.radius,
    state.smoothTarget.z + sinPhi * Math.cos(sp.theta) * sp.radius
  );
  camera.lookAt(state.smoothTarget);

  renderer.render(scene, camera);
}

/* =========================================================
   播放 —— 修复倒放 bug：使用局部时间基准
   ========================================================= */
function startPlay(){
  if (state.playing) return;
  if (state.cursorFloat >= state.N - 1){
    state.cursorFloat = 0;
    state.cursorIdx = 0;
    applyCursor();
  }
  state.playing = true;
  $('btnPlay').textContent = '⏸';

  // 局部时间基准：与 animate() 完全独立
  var prev = performance.now();

  function step(now){
    if (!state.playing) return;

    var dt = (now - prev) / 1000;
    prev = now;

    // 防御性：极端帧间隔下钳制 dt
    if (dt < 0) dt = 0;
    if (dt > 0.2) dt = 0.2;

    var rate = ((state.N - 1) / state.span) * state.playSpeed;
    state.cursorFloat += rate * dt;

    if (state.cursorFloat >= state.N - 1){
      state.cursorFloat = state.N - 1;
      applyCursor();
      stopPlay();
      return;
    }

    applyCursor();
    state.playRAF = requestAnimationFrame(step);
  }
  state.playRAF = requestAnimationFrame(step);
}

function stopPlay(){
  state.playing = false;
  if (state.playRAF){
    cancelAnimationFrame(state.playRAF);
    state.playRAF = null;
  }
  $('btnPlay').textContent = '▶';
}

function togglePlay(){
  if (state.playing) stopPlay(); else startPlay();
}

    btnFollow.style.color = state.follow ? '' : 'var(--muted)';
    if (!state.follow){
      // 冻结当前平滑目标
      var cf = clamp(state.cursorFloat, 0, state.N - 1);
      var i0 = Math.floor(cf);
      var i1 = Math.min(i0 + 1, state.N - 1);
      var f = cf - i0;
      var p0 = state.path[i0], p1 = state.path[i1];
      state.smoothTarget.set(
        p0.x + (p1.x - p0.x) * f,
        p0.y + (p1.y - p0.y) * f,
        p0.z + (p1.z - p0.z) * f
      );
    }
  });

  var btnTrail = $('btnTrail');
  if (btnTrail) btnTrail.addEventListener('click', function(){
    state.showTrail = !state.showTrail;
    btnTrail.style.color = state.showTrail ? '' : 'var(--muted)';
    updateTrailDraw();
  });

  var btnTogglePanel = $('btnTogglePanel');
  if (btnTogglePanel) btnTogglePanel.addEventListener('click', function(){
    var p = $('sidePanel');
    if (p) p.classList.toggle('hidden');
  });

  document.addEventListener('keydown', function(e){
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === 'ArrowLeft'){
      if (state.cursorFloat > 0){
        stopPlay();
        state.cursorFloat = Math.max(0, state.cursorFloat - 1);
        applyCursor();
      }
      e.preventDefault();
    } else if (e.key === 'ArrowRight'){
      if (state.cursorFloat < state.N - 1){
        stopPlay();
        state.cursorFloat = Math.min(state.N - 1, state.cursorFloat + 1);
        applyCursor();
      }
      e.preventDefault();
    } else if (e.key === ' '){
      togglePlay();
      e.preventDefault();
    } else if (e.key === 'Home'){
      stopPlay(); state.cursorFloat = 0; applyCursor(); e.preventDefault();
    } else if (e.key === 'End'){
      stopPlay(); state.cursorFloat = state.N - 1; applyCursor(); e.preventDefault();
    } else if (e.key === 'r' || e.key === 'R'){
      state.panOffset.set(0, 0, 0);
      e.preventDefault();
    } else if (e.key === 'l' || e.key === 'L'){
      placeRunwayAtCursor();
      e.preventDefault();
    }
  });
}

/* =========================================================
   内置示例
   ========================================================= */
function makeSampleLNFDR(){
  var N = 120, t0 = 0, t1 = 180;
  var dt = (t1 - t0) / (N - 1);

  function smoothstep(t){ return t * t * (3 - 2 * t); }
  function noise(i, f, a){ return Math.sin(i * f) * a + Math.sin(i * f * 2.7 + 1.3) * a * 0.42; }
  function series(fn){ var a = []; for (var i = 0; i < N; i++) a.push(fn(i / (N - 1), i)); return a; }
  function stateSeries(spec){
    return series(function(t){
      var v = spec.length ? spec[0].value : 0;
      for (var i = 0; i < spec.length; i++){
        var s = spec[i];
        if (t >= s.from && t < s.to) v = s.value;
      }
      return v;
    });
  }
  function constSeries(v){ var a = []; for (var i = 0; i < N; i++) a.push(v); return a; }
  function simpleOsc(base, amp, freq, seed){
    return series(function(t, i){ return base + Math.sin(i * freq + seed) * amp; });
  }

  var groups = [
    { name: '飞行路径与速度', parameters: [
      { name: '气压高度', unit: 'ft', type: 'numeric', series: series(function(t, i){
        var v = t < 0.88 ? 2500 * (1 - (t/0.88) * 0.72 - Math.pow(t/0.88, 2) * 0.28) : 0;
        return Math.max(0, v + noise(i, 0.35, 2));
      })},
      { name: '指示空速', unit: 'kt', type: 'numeric', series: series(function(t, i){
        var v = t < 0.88 ? 145 * (1 - 0.05 * t / 0.88)
          : 145 * 0.95 * Math.max(0, 1 - Math.pow((t-0.88)/0.12, 2) * 1.08);
        return Math.max(0, v + noise(i, 0.9, 0.6));
      })},
      { name: '航向', unit: '°', type: 'numeric', series: series(function(t, i){ return 270 + noise(i, 0.15, 0.6); }) },
      { name: '偏流角', unit: '°', type: 'numeric', series: series(function(t, i){ return 2.0 * (1 - 0.6 * t) + noise(i, 0.3, 0.12); }) },
      { name: '风速', unit: 'kt', type: 'numeric', series: series(function(t, i){ return 8 * (1 - 0.5 * t) + noise(i, 0.4, 0.35); }) },
      { name: '风向', unit: '°', type: 'numeric', series: simpleOsc(200, 3, 0.2, 0.5) }
    ]},
    { name: '飞机姿态与加速度', parameters: [
      { name: '俯仰姿态', unit: '°', type: 'numeric', series: series(function(t, i){
        var v = 2.5;
        if (t >= 0.76 && t < 0.88) v = 2.5 + 4.0 * smoothstep((t - 0.76) / 0.12);
        else if (t >= 0.88 && t < 0.95) v = 6.5 - 8.0 * (t - 0.88) / 0.07;
        else if (t >= 0.95) v = -1.5 + 1.5 * Math.min(1, (t - 0.95) / 0.05);
        return v + noise(i, 2.0, 0.08);
      })},
      { name: '滚转姿态', unit: '°', type: 'numeric', series: series(function(t, i){ return 0.5 * (1 - 0.7 * t) + noise(i, 0.8, 0.14); }) },
      { name: '法向加速度', unit: 'g', type: 'numeric', series: series(function(t, i){
        var v = 1.0;
        if (t > 0.85 && t < 0.93) v += 0.35 * Math.exp(-Math.pow((t - 0.88) / 0.02, 2));
        return v + noise(i, 3, 0.012);
      })},
      { name: '纵向加速度', unit: 'g', type: 'numeric', series: series(function(t, i){ return t < 0.88 ? noise(i, 3, 0.008) : -0.35 * (t - 0.88) / 0.12; }) },
      { name: '横向加速度', unit: 'g', type: 'numeric', series: simpleOsc(0, 0.009, 2, 1.2) },
      { name: '迎角', unit: '°', type: 'numeric', series: series(function(t, i){
        var v = 4.0;
        if (t >= 0.76 && t < 0.88) v = 4.0 + 4.0 * smoothstep((t - 0.76) / 0.12);
        else if (t >= 0.88 && t < 0.95) v = 8 - 8 * (t - 0.88) / 0.07;
        else if (t >= 0.95) v = 0;
        return Math.max(0, v + noise(i, 2, 0.12));
      })}
    ]},
    { name: '发动机与动力系统', parameters: [
      { name: '1 号发动机 N1', unit: '%', type: 'numeric', series: series(function(t, i){
        var v = 58;
        if (t >= 0.88 && t < 0.94) v = 58 + 20 * (t - 0.88) / 0.06;
        else if (t >= 0.94) v = 78 - 33 * Math.min(1, (t - 0.94) / 0.06);
        return v + noise(i, 1.5, 0.28);
      })},
      { name: '2 号发动机 N1', unit: '%', type: 'numeric', series: series(function(t, i){
        var v = 58;
        if (t >= 0.88 && t < 0.94) v = 58 + 20 * (t - 0.88) / 0.06;
        else if (t >= 0.94) v = 78 - 33 * Math.min(1, (t - 0.94) / 0.06);
        return v + noise(i, 1.1, 0.4) + noise(i, 1.5, 0.2);
      })},
      { name: '推力手柄位置', unit: '%', type: 'numeric', series: series(function(t, i){
        var v = 45;
        if (t < 0.88) v = 45 + noise(i, 1, 0.25);
        else if (t < 0.93) v = 45 - 15 * (t - 0.88) / 0.05;
        else v = 45 - 15 - 10 * (t - 0.93) / 0.07;
        return Math.max(0, v + noise(i, 1, 0.3));
      })},
      { name: '1 号发动机 EGT', unit: '°C', type: 'numeric', series: series(function(t, i){
        var v = 580;
        if (t > 0.88) v = 580 + 42 * Math.sin(Math.PI * (t - 0.88) / 0.12) - 32 * (t - 0.88) / 0.12;
        return v + noise(i, 0.8, 2.0);
      })},
      { name: '2 号发动机 EGT', unit: '°C', type: 'numeric', series: series(function(t, i){
        var v = 580;
        if (t > 0.88) v = 580 + 42 * Math.sin(Math.PI * (t - 0.88) / 0.12) - 32 * (t - 0.88) / 0.12;
        return v - 2 + noise(i, 0.9, 1.8);
      })}
    ]},
    { name: '飞行操纵与系统状态', parameters: [
      { name: '俯仰操纵输入', unit: '°', type: 'numeric', series: series(function(t, i){
        var v = 0;
        if (t >= 0.76 && t < 0.88) v = 3.5 * smoothstep((t - 0.76) / 0.12);
        else if (t >= 0.88) v = Math.max(0, 3.5 - 8 * (t - 0.88));
        return v + noise(i, 2, 0.08);
      })},
      { name: '横向操纵输入', unit: '°', type: 'numeric', series: simpleOsc(0, 0.22, 1.3, 0.7) },
      { name: '方向舵脚蹬输入', unit: '°', type: 'numeric', series: simpleOsc(0, 0.2, 1.1, 1.8) },
      { name: '升降舵位置', unit: '°', type: 'numeric', series: series(function(t, i){
        var v = -3.0;
        if (t >= 0.76 && t < 0.88) v = -3 - 5.0 * smoothstep((t - 0.76) / 0.12);
        else if (t >= 0.88) v = -8 + 12 * Math.min(1, (t - 0.88) / 0.07);
        return v + noise(i, 2, 0.22);
      })},
      { name: '副翼位置', unit: '°', type: 'numeric', series: simpleOsc(0, 0.3, 1.2, 2.1) },
      { name: '方向舵位置', unit: '°', type: 'numeric', series: simpleOsc(0, 0.22, 1.3, 3.4) },
      { name: '俯仰配平位置', unit: 'unit', type: 'numeric', series: series(function(t, i){ return 2.5 * (1 - 0.35 * t) + noise(i, 0.4, 0.05); }) },
      { name: '后缘襟翼位置', unit: '—', type: 'select', options: ['0','1','2','3','FULL'],
        series: stateSeries([{from:0, to:1, value:4}]) },
      { name: '前缘缝翼位置', unit: '—', type: 'select', options: ['收起','展开'], series: constSeries(1) },
      { name: '起落架状态', unit: '—', type: 'select', options: ['收起','放下'], series: constSeries(1) },
      { name: '地面扰流板', unit: '—', type: 'select', options: ['未展开','展开'],
        series: stateSeries([{from:0, to:0.88, value:0}, {from:0.88, to:1, value:1}]) },
      { name: '空 / 地状态', unit: '—', type: 'select', options: ['空中','地面'],
        series: stateSeries([{from:0, to:0.88, value:0}, {from:0.88, to:1, value:1}]) }
    ]},
    { name: '告警与警告系统', parameters: [
      { name: '近地警告 (GPWS)', unit: '—', type: 'select', options: ['正常','警告'], alarmOption: '警告',
        series: stateSeries([{from:0, to:0.70, value:0}, {from:0.70, to:0.74, value:1}, {from:0.74, to:1, value:0}]) },
      { name: '失速警告 (STALL)', unit: '—', type: 'select', options: ['正常','警告'], alarmOption: '警告',
        series: stateSeries([{from:0, to:0.80, value:0}, {from:0.80, to:0.83, value:1}, {from:0.83, to:1, value:0}]) },
      { name: '风切变警告 (WS)', unit: '—', type: 'select', options: ['正常','警告'], alarmOption: '警告', series: constSeries(0) },
      { name: '构型警告 (CONFIG)', unit: '—', type: 'select', options: ['正常','警告'], alarmOption: '警告', series: constSeries(0) },
      { name: '超速警告 (OVERSPD)', unit: '—', type: 'select', options: ['正常','警告'], alarmOption: '警告', series: constSeries(0) },
      { name: 'TCAS 交通咨询', unit: '—', type: 'select', options: ['无','TA','RA'], alarmOption: 'RA', series: constSeries(0) }
    ]},
    { name: '通信与自动化系统', parameters: [
      { name: '自动驾驶仪接通', unit: '—', type: 'select', options: ['断开','接通'],
        series: stateSeries([{from:0, to:0.62, value:1}, {from:0.62, to:1, value:0}]) },
      { name: '自动飞行模式', unit: '—', type: 'select', options: ['OFF','HDG','NAV','LOC','APPR'],
        series: stateSeries([{from:0, to:0.72, value:4}, {from:0.72, to:1, value:0}]) },
      { name: '自动油门模式', unit: '—', type: 'select', options: ['OFF','SPEED','MACH','N1'],
        series: stateSeries([{from:0, to:0.75, value:1}, {from:0.75, to:1, value:0}]) },
      { name: '主警告', unit: '—', type: 'select', options: ['正常','警告'], alarmOption: '警告',
        series: stateSeries([{from:0, to:0.86, value:0}, {from:0.86, to:0.90, value:1}, {from:0.90, to:1, value:0}]) }
    ]},
    { name: '其他环境与状态参数', parameters: [
      { name: '外界大气总温', unit: '°C', type: 'numeric', series: series(function(t, i){ return 15.0 + 4.2 * t + noise(i, 0.3, 0.35); }) },
      { name: '1 号导航接收机频率', unit: 'MHz', type: 'numeric', series: constSeries(110.30) },
      { name: '2 号导航接收机频率', unit: 'MHz', type: 'numeric', series: constSeries(110.90) }
    ]}
  ];

  var times = [];
  for (var i = 0; i < N; i++) times.push(+(t0 + dt * i).toFixed(3));

  return {
    format: 'LNFDR', version: '4.1',
    generator: 'LN-LAB & Photaxis-Lab',
    createdAt: new Date().toISOString(),
    meta: {
      aircraftType: 'A320-271N',
      tailNumber: 'N-939LN',
      flightNumber: 'DAL9999',
      date: new Date().toISOString().slice(0, 10),
      recorderType: 'FDR (Flight Data Recorder)',
      operator: 'Delta Air Lines'
    },
    timeline: { start: t0, end: t1, samples: N, times: times },
    labels: [],
    stats: { groupCount: groups.length, parameterCount: groups.reduce(function(s, g){ return s + g.parameters.length; }, 0) },
    groups: groups
  };
}

/* =========================================================
   启动
   ========================================================= */
function showError(msg){
  var errEl = $('overlayErr');
  if (errEl){ errEl.style.display = 'block'; errEl.textContent = '⚠ ' + msg; }
  var ov = $('overlay');
  if (ov) ov.classList.remove('hide');
}

function boot(){
  try { bindUI(); } catch(e){ console.error('UI 绑定失败', e); }

  if (typeof THREE === 'undefined'){
    showError('Three.js 加载失败，请检查网络后刷新页面。');
    return;
  }

  try { initThree(); }
  catch(e){
    console.error('3D 初始化失败', e);
    showError('3D 场景初始化失败：' + e.message);
    return;
  }

  try {
    var sample = makeSampleLNFDR();
    loadLNFDR(sample);
    setTimeout(function(){ $('overlay').classList.add('hide'); }, 500);
  } catch(err){
    console.error(err);
    showError('示例数据加载失败：' + err.message);
  }
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
