<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 极简阅读器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .card { width: 100%; max-width: 1100px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 92vh; }
    .header { padding: 12px 20px; border-bottom: 1px solid #f0f0f5; display: flex; justify-content: space-between; align-items: center; }
    .header h3 { font-size: 15px; color: #1c1c1e; }
    .toolbar { padding: 10px 20px; background: #fff; border-top: 1px solid #f0f0f5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .toolbar input { padding: 8px 12px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 13px; outline: none; background: #f8f8fa; }
    .toolbar input:focus { border-color: #007aff; background: #fff; }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.15s; }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-secondary { background: #f2f2f7; color: #1c1c1e; border: 1px solid #e5e5ea; }
    .btn-outline { background: transparent; color: #007aff; border: 1px solid #c7d9f0; text-decoration: none; display: inline-flex; align-items: center; }
    iframe { width: 100%; height: 100%; min-height: 80vh; border: none; flex: 1; }
    @media (max-width: 640px) { .toolbar { flex-direction: column; align-items: stretch; } .toolbar input { width: 100%; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h3>PDF 在线预览</h3>
      <a href="file:///D:/Downloads/ans=ls.pdf" target="_blank" class="btn btn-outline">新窗口打开</a>
    </div>
    <iframe id="pdfFrame" src="file:///D:/Downloads/ans=ls.pdf"></iframe>
    <div class="toolbar">
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:13px; font-weight:500;">🔍 搜索</span>
        <input type="text" id="searchInput" placeholder="输入文字..." />
        <button class="btn btn-primary" onclick="doSearch()">搜索</button>
        <button class="btn btn-secondary" onclick="clearSearch()">清除</button>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:13px; font-weight:500;">📄 页码</span>
        <input type="number" id="pageInput" min="1" value="1" style="width:70px; text-align:center;" />
        <button class="btn btn-primary" onclick="doJump()">跳转</button>
      </div>
    </div>
  </div>
  <script>
    var baseUrl = "file:///D:/Downloads/ans=ls.pdf";
    var frame = document.getElementById('pdfFrame');

    function doSearch() {
      var kw = document.getElementById('searchInput').value.trim();
      if (!kw) { alert('请输入搜索词'); return; }
      frame.src = baseUrl.split('#')[0] + '#search=' + encodeURIComponent(kw);
    }
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      frame.src = baseUrl.split('#')[0];
    }
    function doJump() {
      var num = parseInt(document.getElementById('pageInput').value, 10);
      if (isNaN(num) || num < 1) { alert('请输入有效页码'); return; }
      frame.src = baseUrl.split('#')[0] + '#page=' + num;
    }
    
    // E 键跳转 Bing
    document.addEventListener('keydown', function(e) {
      var tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
      if (e.key === 'e' || e.key === 'E') {
        e.preventDefault();
        window.open('https://www.bing.com', '_blank');
      }
    });
  </script>
</body>
</html>
