<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSC · 文件加密</title>
<style>
/* ============ 主题变量 ============ */
:root {
  --bg:        #faf8f5;
  --bg-soft:   #f2eee7;
  --surface:   #ffffff;
  --surface-2: #f6f3ee;
  --border:    #e7e1d8;
  --text:      #1b1b1d;
  --text-2:    #8d857a;
  --a1: #1f8a7d;   /* 白杨绿 */
  --a2: #3a7bd5;   /* 大盐湖蓝 */
  --a3: #dd5a3c;   /* 峡谷红 */
  --a4: #d9a441;   /* 砂岩金 */
  --a5: #e8894a;   /* 落日橙 */
  --orb-op: .34;
  --shadow: 0 10px 30px -18px rgba(30,30,40,.45);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg:        #0c1117;
  --bg-soft:   #101820;
  --surface:   #151d27;
  --surface-2: #1b2531;
  --border:    #26313f;
  --text:      #e9eef6;
  --text-2:    #7d8a9c;
  --a1: #2ec4b6;
  --a2: #5eb3e4;
  --a3: #ff7a5c;
  --a4: #f0c25e;
  --a5: #ffa46b;
  --orb-op: .5;
  --shadow: 0 14px 40px -22px rgba(0,0,0,.9);
  color-scheme: dark;
}

/* 角度动画属性（用于按钮边缘流光） */
@property --ga {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

/* ============ 基础 ============ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  padding: 40px 20px 28px;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background-color .35s ease, color .35s ease;
}

/* ============ 背景装饰 ============ */
.orbs {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: var(--orb-op);
  transition: opacity .5s ease;
  animation: orb-float 22s ease-in-out infinite;
}
.orb-1 { width: 460px; height: 460px; left: -140px; top: -160px; background: var(--a2); animation-delay: -3s; }
.orb-2 { width: 400px; height: 400px; right: -120px; top: 10%; background: var(--a5); animation-delay: -9s; }
.orb-3 { width: 360px; height: 360px; left: 30%; bottom: -180px; background: var(--a1); animation-delay: -15s; }
.orb-4 { width: 260px; height: 260px; right: 12%; bottom: 8%; background: var(--a4); opacity: calc(var(--orb-op) * .7); animation-delay: -6s; }

@keyframes orb-float {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  33%      { transform: translate3d(30px, -40px, 0) scale(1.08); }
  66%      { transform: translate3d(-25px, 25px, 0) scale(.95); }
}

/* 峡谷波浪线（灵感来自 SLC 机场天花板） */
.waves {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: .5;
  pointer-events: none;
}
[data-theme="dark"] .waves { opacity: .32; }

/* ============ 主容器 ============ */
.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 68px);
}

/* ============ 顶栏 ============ */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 30px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark {
  width: 32px; height: 32px;
  flex-shrink: 0;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--a2), var(--a5) 48%, var(--a3));
  box-shadow: 0 6px 18px -8px var(--a2);
  position: relative;
  transition: transform .3s cubic-bezier(.4,0,.2,1), box-shadow .3s;
}
.mark::after {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 3px;
  background: var(--bg);
  transition: background-color .35s ease;
}
.brand:hover .mark {
  transform: rotate(-8deg) scale(1.06);
  box-shadow: 0 8px 24px -8px var(--a5);
}
.brand-text { min-width: 0; }
h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
}
.sub {
  margin: 1px 0 0;
  font-size: 12px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 主题按钮 */
.theme-btn {
  flex-shrink: 0;
  width: 38px; height: 38px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 50%;
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  position: relative;
  isolation: isolate;
  box-shadow: inset 0 0 0 1px var(--border);
  transition: box-shadow .25s, transform .2s;
}
.theme-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 1.4px;
  background: conic-gradient(from var(--ga), var(--a2), var(--a5), var(--a3), var(--a4), var(--a1), var(--a2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0;
  z-index: -1;
  pointer-events: none;
  transition: opacity .25s;
}
.theme-btn:hover::before { opacity: 1; animation: ga-spin 2.4s linear infinite; }
.theme-btn:active { transform: scale(.93); }
.theme-btn .sun, .theme-btn .moon { transition: opacity .25s, transform .35s; }
[data-theme="light"] .theme-btn .sun  { opacity: 0; transform: scale(.5) rotate(-40deg); position: absolute; }
[data-theme="light"] .theme-btn .moon { opacity: 1; transform: scale(1); }
[data-theme="dark"]  .theme-btn .sun  { opacity: 1; transform: scale(1); }
[data-theme="dark"]  .theme-btn .moon { opacity: 0; transform: scale(.5) rotate(40deg); position: absolute; }

@keyframes ga-spin { to { --ga: 360deg; } }

/* ============ 分段控件 ============ */
.segmented {
  position: relative;
  display: flex;
  padding: 3px;
  border-radius: 12px;
  background: var(--bg-soft);
  box-shadow: inset 0 0 0 1px var(--border);
  margin-bottom: 26px;
  transition: background-color .35s, box-shadow .35s;
}
.seg-thumb {
  position: absolute;
  top: 3px; left: 3px;
  width: calc(50% - 3px);
  height: calc(100% - 6px);
  border-radius: 9px;
  background: linear-gradient(135deg, var(--a2), var(--a5));
  box-shadow: 0 6px 16px -8px var(--a2);
  transition: transform .3s cubic-bezier(.4,0,.2,1), background .35s, box-shadow .35s;
}
.segmented[data-mode="decrypt"] .seg-thumb {
  transform: translateX(calc(100% + 3px));
  background: linear-gradient(135deg, var(--a1), var(--a2));
  box-shadow: 0 6px 16px -8px var(--a1);
}
.segmented button {
  flex: 1;
  position: relative;
  z-index: 1;
  border: 0;
  background: transparent;
  padding: 8px 0;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  border-radius: 9px;
  transition: color .25s;
}
.segmented button.active { color: #fff; }

/* ============ 面板 ============ */
.panel {
  background: var(--surface);
  border-radius: 18px;
  padding: 22px;
  box-shadow: var(--shadow), inset 0 0 0 1px var(--border);
  transition: background-color .35s, box-shadow .35s;
}

/* 字段 */
.field { display: block; margin-bottom: 16px; }
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  margin-bottom: 8px;
  letter-spacing: .02em;
}
input[type="password"], input[type="text"] {
  width: 100%;
  font: inherit;
  font-size: 13.5px;
  padding: 10px 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  outline: none;
  transition: border-color .2s, background-color .35s, box-shadow .2s;
}
input::placeholder { color: var(--text-2); opacity: .7; }
input:focus {
  border-color: var(--a2);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--a2) 16%, transparent);
}

/* 密码强度 */
.strength {
  display: flex;
  gap: 5px;
  margin-top: 9px;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity .25s, transform .25s;
  pointer-events: none;
}
.strength.show { opacity: 1; transform: none; }
.strength i {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  transition: background-color .3s;
}

/* ============ 算法选择 ============ */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px;
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-2);
  background: var(--surface-2);
  border: none;
  border-radius: 9px;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--border);
  transition: color .2s, background-color .3s, box-shadow .25s, transform .15s;
}
.chip .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--c, var(--a2));
  box-shadow: 0 0 0 0 transparent;
  transition: box-shadow .3s, transform .3s;
}
.chip:hover { color: var(--text); transform: translateY(-1px); }
.chip.active {
  color: var(--text);
  background: color-mix(in srgb, var(--c, var(--a2)) 13%, var(--surface-2));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--a2)) 55%, transparent);
}
.chip.active .dot {
  transform: scale(1.15);
  box-shadow: 0 0 10px 1px color-mix(in srgb, var(--c, var(--a2)) 70%, transparent);
}
/* 芯片边缘亮灯 */
.chip::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 9px;
  padding: 1px;
  background: conic-gradient(from var(--ga), var(--a2), var(--a5), var(--a3), var(--a4), var(--a1), var(--a2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0;
  z-index: -1;
  pointer-events: none;
  transition: opacity .25s;
}
.chip:hover::before { opacity: .9; animation: ga-spin 2.8s linear infinite; }

/* ============ 拖拽区 ============ */
.drop {
  margin-top: 4px;
  padding: 26px 16px;
  border-radius: 14px;
  border: 1px dashed var(--border);
  text-align: center;
  color: var(--text-2);
  font-size: 13px;
  cursor: pointer;
  user-select: none;
  transition: border-color .25s, box-shadow .3s, background-color .3s, color .25s;
}
.drop:hover {
  color: var(--text);
  border-color: color-mix(in srgb, var(--a2) 60%, var(--border));
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--a2) 10%, transparent);
  background: color-mix(in srgb, var(--a2) 4%, transparent);
}
.drop.over {
  color: var(--text);
  border-color: var(--a5);
  background: color-mix(in srgb, var(--a5) 8%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--a5) 16%, transparent),
              0 12px 40px -18px var(--a5);
  animation: drop-pulse 1.1s ease-in-out infinite;
}
@keyframes drop-pulse {
  0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--a5) 16%, transparent), 0 12px 40px -18px var(--a5); }
  50%      { box-shadow: 0 0 0 7px color-mix(in srgb, var(--a5) 8%, transparent), 0 12px 46px -14px var(--a5); }
}
.drop-inner { display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none; }
.drop-plus {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 17px;
  color: var(--text-2);
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border);
  transition: all .3s;
}
.drop:hover .drop-plus {
  color: #fff;
  background: linear-gradient(135deg, var(--a2), var(--a5));
  box-shadow: 0 6px 18px -8px var(--a2);
  transform: rotate(90deg);
}
.drop-hint { font-size: 11.5px; color: var(--text-2); opacity: .8; }

/* ============ 文件列表 ============ */
.files { list-style: none; margin: 14px 0 0; padding: 0; }
.files li {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 2px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  animation: slide-in .28s cubic-bezier(.4,0,.2,1);
}
.files li:last-child { border-bottom: none; }
.files .name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.files .size { flex-shrink: 0; font-size: 11.5px; color: var(--text-2); }
.files .rm {
  flex-shrink: 0;
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text-2);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  font-family: inherit;
  transition: color .2s, background-color .2s, transform .2s;
}
.files .rm:hover { color: var(--a3); background: color-mix(in srgb, var(--a3) 12%, transparent); transform: rotate(90deg); }

@keyframes slide-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ============ 按钮 ============ */
.actions { display: flex; gap: 10px; margin-top: 22px; }

.btn {
  position: relative;
  isolation: isolate;
  border: 0;
  padding: 10px 22px;
  border-radius: 11px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  background: transparent;
  cursor: pointer;
  transition: transform .15s, color .2s, opacity .2s;
}
/* 表面层 */
.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 11px;
  background: var(--btn-bg, var(--surface-2));
  box-shadow: inset 0 0 0 1px var(--border);
  z-index: -2;
  pointer-events: none;
  transition: box-shadow .25s, background-color .35s;
}
/* 边缘流光层 */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 11px;
  padding: 1px;
  background: conic-gradient(from var(--ga), var(--a2), var(--a5), var(--a3), var(--a4), var(--a1), var(--a2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0;
  z-index: -1;
  pointer-events: none;
  transition: opacity .28s;
}
.btn:hover:not(:disabled)::before { opacity: 1; animation: ga-spin 2.6s linear infinite; }
.btn:hover:not(:disabled)::after { box-shadow: inset 0 0 0 1px transparent; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.985); }
.btn:disabled { opacity: .38; cursor: not-allowed; }

.btn.primary {
  --btn-bg: linear-gradient(135deg, var(--a2), var(--a5) 52%, var(--a3));
  color: #fff;
  flex: 1;
  font-weight: 600;
  letter-spacing: .01em;
}
.btn.primary::after { box-shadow: inset 0 0 0 1px transparent; }
.btn.primary:hover:not(:disabled) {
  box-shadow: 0 10px 28px -12px var(--a5);
}
.btn.primary:hover:not(:disabled)::before { opacity: 1; }

/* ============ 进度 ============ */
.progress {
  margin-top: 20px;
  height: 3px;
  border-radius: 99px;
  background: var(--bg-soft);
  overflow: hidden;
  display: none;
}
.progress.show { display: block; }
.progress .bar {
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--a2), var(--a5), var(--a3), var(--a1), var(--a2));
  background-size: 300% 100%;
  animation: bar-flow 2.4s linear infinite;
  transition: width .25s ease;
}
@keyframes bar-flow { to { background-position: -300% 0; } }

/* ============ 状态 ============ */
.status {
  margin-top: 14px;
  font-size: 12.5px;
  color: var(--text-2);
  min-height: 18px;
  word-break: break-all;
  transition: color .2s;
}
.status.ok  { color: var(--a1); }
.status.err { color: var(--a3); }

/* ============ 结果 ============ */
.results { margin-top: 20px; }
.results:empty { display: none; }
.result {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  animation: slide-in .3s cubic-bezier(.4,0,.2,1);
}
.result:last-child { border-bottom: none; }
.result .info { flex: 1; min-width: 0; }
.result .n {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result .m { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }

.result a {
  flex-shrink: 0;
  position: relative;
  isolation: isolate;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 9px;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border);
  transition: color .2s, box-shadow .25s, transform .15s;
  overflow: hidden;
}
.result a::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 9px;
  padding: 1px;
  background: conic-gradient(from var(--ga), var(--a2), var(--a5), var(--a3), var(--a4), var(--a1), var(--a2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0;
  z-index: -1;
  transition: opacity .25s;
}
.result a:hover { transform: translateY(-1px); }
.result a:hover::before { opacity: 1; animation: ga-spin 2.6s linear infinite; }

.result.error .m { color: var(--a3); }
.result.error .n { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--a3) 55%, transparent); }

/* ============ 页脚 ============ */
.foot {
  margin-top: auto;
  padding-top: 44px;
  text-align: center;
  font-size: 11.5px;
  letter-spacing: .02em;
}
.foot a {
  color: var(--text-2);
  text-decoration: none;
  transition: color .2s;
  border-bottom: 1px solid transparent;
}
.foot a:hover {
  color: var(--text);
  border-bottom-color: color-mix(in srgb, var(--a2) 60%, transparent);
}

/* ============ 隐藏工具类 ============ */
.hidden { display: none !important; }

/* ============ 响应式 ============ */
@media (max-width: 480px) {
  body { padding: 26px 14px 22px; }
  .panel { padding: 18px; border-radius: 16px; }
  .chip { padding: 6px 11px; font-size: 12px; }
  .sub { font-size: 11.5px; }
  h1 { font-size: 15px; }
  .actions { flex-direction: column-reverse; }
  .btn.primary { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>

<!-- 背景光斑 -->
<div class="orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<!-- 峡谷波浪线 -->
<svg class="waves" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="var(--a2)" stop-opacity="0"/>
      <stop offset="25%"  stop-color="var(--a2)" stop-opacity=".55"/>
      <stop offset="50%"  stop-color="var(--a5)" stop-opacity=".55"/>
      <stop offset="75%"  stop-color="var(--a3)" stop-opacity=".45"/>
      <stop offset="100%" stop-color="var(--a1)" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M-50,250 C200,180 380,340 640,290 C900,240 1060,400 1320,330 C1420,305 1500,330 1500,330"
        fill="none" stroke="url(#wg)" stroke-width="1.1"/>
  <path d="M-50,330 C220,260 400,430 660,370 C920,310 1080,470 1340,400 C1440,372 1500,400 1500,400"
        fill="none" stroke="url(#wg)" stroke-width=".9" opacity=".7"/>
  <path d="M-50,560 C240,500 420,660 680,600 C940,540 1100,700 1360,630 C1450,606 1500,630 1500,630"
        fill="none" stroke="url(#wg)" stroke-width="1" opacity=".55"/>
</svg>

<main class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand-text">
        <h1>LSC 文件加密</h1>
        <p class="sub">浏览器本地运算 · 文件不上传</p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" title="切换深色 / 浅色" aria-label="切换主题">
      <span class="sun">☀</span>
      <span class="moon">☾</span>
    </button>
  </header>

  <!-- 模式切换 -->
  <div class="segmented" id="segmented" data-mode="encrypt">
    <span class="seg-thumb" aria-hidden="true"></span>
    <button type="button" data-mode="encrypt" class="active">加密</button>
    <button type="button" data-mode="decrypt">解密</button>
  </div>

  <!-- 主面板 -->
  <section class="panel">

    <!-- 算法选择 -->
    <div class="field" id="algoField">
      <span class="field-label">加密算法</span>
      <div class="chips" id="chips">
        <button type="button" class="chip active" data-algo="aes256gcm" style="--c: var(--a2)">
          <i class="dot"></i>AES-256-GCM
        </button>
        <button type="button" class="chip" data-algo="aes128gcm" style="--c: var(--a1)">
          <i class="dot"></i>AES-128-GCM
        </button>
        <button type="button" class="chip" data-algo="aes256cbc" style="--c: var(--a5)">
          <i class="dot"></i>AES-256-CBC
        </button>
        <button type="button" class="chip" data-algo="aes256ctr" style="--c: var(--a4)">
          <i class="dot"></i>AES-256-CTR
        </button>
      </div>
    </div>

    <!-- 密码 -->
    <label class="field" for="pwd">
      <span class="field-label">密码</span>
      <input type="password" id="pwd" placeholder="至少 4 位字符" autocomplete="new-password" spellcheck="false">
    </label>
    <div class="strength" id="strength" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <!-- 确认密码 -->
    <label class="field" id="confirmField" for="pwd2" style="margin-top:16px">
      <span class="field-label">确认密码</span>
      <input type="password" id="pwd2" placeholder="再次输入密码" autocomplete="new-password" spellcheck="false">
    </label>

    <!-- 拖拽区 -->
    <div class="drop" id="drop" role="button" tabindex="0">
      <div class="drop-inner">
        <div class="drop-plus">＋</div>
        <span id="dropText">点击选择文件，或拖拽到此处</span>
        <span class="drop-hint" id="dropHint">支持多选 · 任意类型文件</span>
      </div>
    </div>
    <input type="file" id="fileInput" multiple hidden>

    <!-- 文件列表 -->
    <ul class="files" id="fileList"></ul>

    <!-- 操作按钮 -->
    <div class="actions">
      <button class="btn primary" id="runBtn" type="button" disabled>开始加密</button>
      <button class="btn" id="clearBtn" type="button">清空</button>
    </div>

    <!-- 进度条 -->
    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>

    <!-- 状态提示 -->
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <!-- 结果区 -->
  <div class="results" id="results"></div>

  <!-- 页脚署名 -->
  <footer class="foot">
    <a href="https://SLCLeo-USA.github.io" target="_blank" rel="noopener noreferrer">SLCLeo-USA.github.io</a>
  </footer>
</main>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);

  /* ================= 文件格式常量 ================= */
  const MAGIC = new Uint8Array([0x4C, 0x53, 0x43, 0x32]); // "LSC2"
  const SALT_LEN = 16;
  const PBKDF2_ITER = 200000;
  const TAG_LEN = 32; // HMAC-SHA256

  /* ================= 算法表 ================= */
  const ALGOS = {
    aes256gcm: { id: 1, keyBits: 256, mode: 'GCM', ivLen: 12, mac: false },
    aes128gcm: { id: 2, keyBits: 128, mode: 'GCM', ivLen: 12, mac: false },
    aes256cbc: { id: 3, keyBits: 256, mode: 'CBC', ivLen: 16, mac: true  },
    aes256ctr: { id: 4, keyBits: 256, mode: 'CTR', ivLen: 16, mac: true  }
  };
  const ALGO_BY_ID = {};
  Object.keys(ALGOS).forEach(k => { ALGO_BY_ID[ALGOS[k].id] = ALGOS[k]; });

  /* ================= 状态 ================= */
  const state = { mode: 'encrypt', algo: 'aes256gcm', files: [], busy: false };

  /* ================= DOM ================= */
  const seg           = $('segmented');
  const algoField     = $('algoField');
  const chips         = $('chips');
  const pwdEl         = $('pwd');
  const pwd2El        = $('pwd2');
  const confirmField  = $('confirmField');
  const strengthEl    = $('strength');
  const drop          = $('drop');
  const dropText      = $('dropText');
  const dropHint      = $('dropHint');
  const fileInput     = $('fileInput');
  const fileListEl    = $('fileList');
  const runBtn        = $('runBtn');
  const clearBtn      = $('clearBtn');
  const progressEl    = $('progress');
  const bar           = $('bar');
  const statusEl      = $('status');
  const resultsEl     = $('results');
  const themeBtn      = $('themeBtn');

  /* ================= 主题 ================= */
  const THEME_KEY = 'lsc-theme';
  (function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (sysDark ? 'dark' : 'light');
  })();

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem(THEME_KEY, next);
  });

  /* ================= 工具函数 ================= */
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    const u = ['KB', 'MB', 'GB', 'TB'];
    let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n < 10 ? 2 : 1) + ' ' + u[i];
  }

  function concat(a, b) {
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0);
    out.set(b, a.length);
    return out;
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function setProgress(p) {
    if (p === null) {
      progressEl.classList.remove('show');
      bar.style.width = '0%';
      return;
    }
    progressEl.classList.add('show');
    bar.style.width = Math.max(0, Math.min(100, p)) + '%';
  }

  /* ================= 密码强度 ================= */
  const STRENGTH_COLORS = ['var(--a3)', 'var(--a5)', 'var(--a4)', 'var(--a1)'];

  function updateStrength() {
    const v = pwdEl.value;
    if (!v) { strengthEl.classList.remove('show'); return; }
    strengthEl.classList.add('show');

    let s = 0;
    if (v.length >= 4) s++;
    if (v.length >= 8) s++;
    if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
    if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) s++;

    const bars = strengthEl.children;
    for (let i = 0; i < bars.length; i++) {
      bars[i].style.background = i < s ? STRENGTH_COLORS[s - 1] : 'var(--border)';
    }
  }
  pwdEl.addEventListener('input', updateStrength);

  /* ================= 密钥派生 ================= */
  async function deriveKeyBits(pwd, salt, bits) {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']
    );
    const buf = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: PBKDF2_ITER, hash: 'SHA-256' },
      base, bits
    );
    return new Uint8Array(buf);
  }

  /* ================= PKCS#7 填充 ================= */
  function padPkcs7(data) {
    const p = 16 - (data.length % 16);
    const out = new Uint8Array(data.length + p);
    out.set(data, 0);
    out.fill(p, data.length);
    return out;
  }

  function unpadPkcs7(data) {
    const n = data.length;
    if (n === 0) return data;
    const p = data[n - 1];
    if (p < 1 || p > 16 || p > n) throw new Error('解密失败：填充校验错误');
    for (let i = n - p; i < n; i++) {
      if (data[i] !== p) throw new Error('解密失败：填充校验错误');
    }
    return data.slice(0, n - p);
  }

  /* ================= 加密 ================= */
  async function encryptFile(file, pwd, algoKey) {
    const algo = ALGOS[algoKey];
    if (!algo) throw new Error('未知加密算法');

    const salt = crypto.getRandomValues(new Uint8Array(SALT_LEN));
    const iv = crypto.getRandomValues(new Uint8Array(algo.ivLen));

    // GCM 只需要加密密钥；CBC / CTR 需要加密密钥 + HMAC 密钥
    const bits = algo.mac ? algo.keyBits + 256 : algo.keyBits;
    const keyBits = await deriveKeyBits(pwd, salt, bits);

    const encKey = await crypto.subtle.importKey(
      'raw',
      keyBits.slice(0, algo.keyBits / 8),
      { name: 'AES-' + algo.mode },
      false,
      ['encrypt']
    );

    const plain = new Uint8Array(await file.arrayBuffer());
    let cipher;

    if (algo.mode === 'GCM') {
      cipher = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv }, encKey, plain
      ));
    } else if (algo.mode === 'CBC') {
      const padded = padPkcs7(plain);
      cipher = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-CBC', iv }, encKey, padded
      ));
    } else {
      cipher = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-CTR', counter: iv, length: 64 }, encKey, plain
      ));
    }

    const nameBytes = new TextEncoder().encode(file.name);
    if (nameBytes.length > 65535) throw new Error('文件名过长');

    // 文件头：MAGIC(4) | algoId(1) | salt(16) | iv(n) | nameLen(2) | name
    const header = new Uint8Array(4 + 1 + SALT_LEN + algo.ivLen + 2 + nameBytes.length);
    let o = 0;
    header.set(MAGIC, o); o += 4;
    header[o++] = algo.id;
    header.set(salt, o); o += SALT_LEN;
    header.set(iv, o); o += algo.ivLen;
    header[o++] = (nameBytes.length >>> 8) & 0xFF;
    header[o++] = nameBytes.length & 0xFF;
    header.set(nameBytes, o); o += nameBytes.length;

    let body = cipher;

    if (algo.mac) {
      const macKey = await crypto.subtle.importKey(
        'raw',
        keyBits.slice(algo.keyBits / 8),
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['sign']
      );
      const tag = new Uint8Array(await crypto.subtle.sign(
        'HMAC', macKey, concat(header, cipher)
      ));
      body = concat(cipher, tag);
    }

    const out = concat(header, body);
    return {
      blob: new Blob([out], { type: 'application/octet-stream' }),
      name: file.name + '.lsc'
    };
  }

  /* ================= 解密 ================= */
  async function decryptFile(file, pwd) {
    const buf = new Uint8Array(await file.arrayBuffer());

    if (buf.length < 5) throw new Error('文件过短，不是有效的 .lsc 文件');
    for (let i = 0; i < 4; i++) {
      if (buf[i] !== MAGIC[i]) throw new Error('文件标识不匹配，不是有效的 .lsc 文件');
    }

    let o = 4;
    const algo = ALGO_BY_ID[buf[o++]];
    if (!algo) throw new Error('文件使用了未知的加密算法');
    if (buf.length < 5 + SALT_LEN + algo.ivLen + 2) throw new Error('文件已损坏');

    const salt = buf.slice(o, o + SALT_LEN); o += SALT_LEN;
    const iv = buf.slice(o, o + algo.ivLen); o += algo.ivLen;
    const nameLen = (buf[o] << 8) | buf[o + 1]; o += 2;
    if (o + nameLen > buf.length) throw new Error('文件已损坏');
    const nameBytes = buf.slice(o, o + nameLen); o += nameLen;

    const header = buf.slice(0, o);
    const body = buf.slice(o);

    let plain;

    if (algo.mac) {
      if (body.length < TAG_LEN) throw new Error('文件已损坏');
      const cipher = body.slice(0, body.length - TAG_LEN);
      const tag = body.slice(body.length - TAG_LEN);

      const keyBits = await deriveKeyBits(pwd, salt, algo.keyBits + 256);

      const macKey = await crypto.subtle.importKey(
        'raw',
        keyBits.slice(algo.keyBits / 8),
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['verify']
      );
      const valid = await crypto.subtle.verify('HMAC', macKey, tag, concat(header, cipher));
      if (!valid) throw new Error('密码错误或文件已被篡改');

      const encKey = await crypto.subtle.importKey(
        'raw',
        keyBits.slice(0, algo.keyBits / 8),
        { name: 'AES-' + algo.mode },
        false,
        ['decrypt']
      );

      if (algo.mode === 'CBC') {
        const padded = new Uint8Array(await crypto.subtle.decrypt(
          { name: 'AES-CBC', iv }, encKey, cipher
        ));
        plain = unpadPkcs7(padded);
      } else {
        plain = new Uint8Array(await crypto.subtle.decrypt(
          { name: 'AES-CTR', counter: iv, length: 64 }, encKey, cipher
        ));
      }
    } else {
      const keyBits = await deriveKeyBits(pwd, salt, algo.keyBits);
      const encKey = await crypto.subtle.importKey(
        'raw', keyBits, { name: 'AES-GCM' }, false, ['decrypt']
      );
      try {
        plain = new Uint8Array(await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv }, encKey, body
        ));
      } catch (e) {
        throw new Error('密码错误或文件已被篡改');
      }
    }

    const name = new TextDecoder().decode(nameBytes) || 'decrypted';
    return { blob: new Blob([plain]), name };
  }

  /* ================= 文件列表 ================= */
  function renderFiles() {
    fileListEl.innerHTML = '';

    state.files.forEach((f, i) => {
      const li = document.createElement('li');

      const nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = f.name;
      nm.title = f.name;

      const sz = document.createElement('span');
      sz.className = 'size';
      sz.textContent = fmtSize(f.size);

      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.textContent = '×';
      rm.title = '移除';
      rm.setAttribute('aria-label', '移除文件');
      rm.addEventListener('click', () => {
        if (state.busy) return;
        state.files.splice(i, 1);
        renderFiles();
        updateUI();
      });

      li.append(nm, sz, rm);
      fileListEl.append(li);
    });
  }

  function updateUI() {
    runBtn.disabled = state.busy || state.files.length === 0;
    runBtn.textContent = state.busy
      ? '处理中…'
      : (state.mode === 'encrypt' ? '开始加密' : '开始解密');
  }

  /* ================= 添加文件 ================= */
  function addFiles(list) {
    if (state.busy || !list || !list.length) return;

    const seen = new Set(state.files.map(f => f.name + '|' + f.size + '|' + f.lastModified));
    let added = 0;

    Array.from(list).forEach(f => {
      const k = f.name + '|' + f.size + '|' + f.lastModified;
      if (seen.has(k)) return;
      seen.add(k);
      state.files.push(f);
      added++;
    });

    if (added) {
      renderFiles();
      updateUI();
      setStatus('');
    }
  }

  /* ================= 结果渲染 ================= */
  function addResult(name, blob, meta) {
    const row = document.createElement('div');
    row.className = 'result';

    const info = document.createElement('div');
    info.className = 'info';

    const n = document.createElement('div');
    n.className = 'n';
    n.textContent = name;
    n.title = name;

    const m = document.createElement('div');
    m.className = 'm';
    m.textContent = meta;

    info.append(n, m);

    const a = document.createElement('a');
    a.textContent = '下载';
    a.href = URL.createObjectURL(blob);
    a.download = name;

    row.append(info, a);
    resultsEl.append(row);
  }

  function addError(name, msg) {
    const row = document.createElement('div');
    row.className = 'result error';

    const info = document.createElement('div');
    info.className = 'info';

    const n = document.createElement('div');
    n.className = 'n';
    n.textContent = name;
    n.title = name;

    const m = document.createElement('div');
    m.className = 'm';
    m.textContent = msg;

    info.append(n, m);
    row.append(info);
    resultsEl.append(row);
  }

  /* ================= 主流程 ================= */
  async function run() {
    if (state.busy || !state.files.length) return;

    const pwd = pwdEl.value;
    if (pwd.length < 4) {
      setStatus('密码至少需要 4 位字符', 'err');
      pwdEl.focus();
      return;
    }
    if (state.mode === 'encrypt' && pwd !== pwd2El.value) {
      setStatus('两次输入的密码不一致', 'err');
      pwd2El.focus();
      return;
    }

    state.busy = true;
    updateUI();
    resultsEl.innerHTML = '';
    setStatus('');
    setProgress(0);

    const algoKey = state.algo;
    const files = state.files.slice();
    let ok = 0, fail = 0;

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      setStatus(`(${i + 1}/${files.length}) ${f.name}`);

      try {
        const r = state.mode === 'encrypt'
          ? await encryptFile(f, pwd, algoKey)
          : await decryptFile(f, pwd);

        addResult(r.name, r.blob, `${fmtSize(f.size)} → ${fmtSize(r.blob.size)}`);
        ok++;
      } catch (err) {
        addError(f.name, (err && err.message) ? err.message : '未知错误');
        fail++;
      }

      setProgress(((i + 1) / files.length) * 100);
      await new Promise(r => setTimeout(r, 0));
    }

    state.busy = false;
    updateUI();

    if (fail === 0) {
      setStatus(`完成 · 共 ${ok} 个文件已就绪`, 'ok');
    } else if (ok === 0) {
      setStatus(`全部失败（${fail} 个）`, 'err');
    } else {
      setStatus(`完成：成功 ${ok} 个，失败 ${fail} 个`, 'err');
    }

    setTimeout(() => setProgress(null), 700);
  }

  /* ================= 模式切换 ================= */
  function setMode(mode) {
    if (state.busy || state.mode === mode) return;
    state.mode = mode;

    seg.dataset.mode = mode;
    seg.querySelectorAll('button[data-mode]').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });

    const enc = mode === 'encrypt';

    algoField.style.display = enc ? '' : 'none';
    confirmField.classList.toggle('hidden', !enc);
    pwd2El.value = '';

    dropText.textContent = enc
      ? '点击选择文件，或拖拽到此处'
      : '点击选择 .lsc 文件，或拖拽到此处';
    dropHint.textContent = enc
      ? '支持多选 · 任意类型文件'
      : '自动识别算法 · 需原密码';

    if (enc) fileInput.removeAttribute('accept');
    else fileInput.setAttribute('accept', '.lsc');

    state.files = [];
    renderFiles();
    resultsEl.innerHTML = '';
    setStatus('');
    setProgress(null);
    updateUI();
  }

  /* ================= 事件绑定 ================= */
  seg.addEventListener('click', e => {
    const btn = e.target.closest('button[data-mode]');
    if (btn) setMode(btn.dataset.mode);
  });

  chips.addEventListener('click', e => {
    const chip = e.target.closest('.chip[data-algo]');
    if (!chip || state.busy) return;
    chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    state.algo = chip.dataset.algo;
  });

  drop.addEventListener('click', () => {
    if (!state.busy) fileInput.click();
  });

  drop.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (!state.busy) fileInput.click();
    }
  });

  ['dragenter', 'dragover'].forEach(ev => {
    drop.addEventListener(ev, e => {
      e.preventDefault();
      e.stopPropagation();
      if (!state.busy) drop.classList.add('over');
    });
  });

  ['dragleave', 'drop'].forEach(ev => {
    drop.addEventListener(ev, e => {
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove('over');
    });
  });

  drop.addEventListener('drop', e => {
    if (state.busy) return;
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      addFiles(e.dataTransfer.files);
    }
  });

  // 阻止浏览器在页面其他位置打开文件
  ['dragover', 'drop'].forEach(ev => {
    window.addEventListener(ev, e => {
      if (!drop.contains(e.target)) e.preventDefault();
    });
  });

  fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  runBtn.addEventListener('click', run);

  clearBtn.addEventListener('click', () => {
    if (state.busy) return;
    state.files = [];
    pwdEl.value = '';
    pwd2El.value = '';
    strengthEl.classList.remove('show');
    renderFiles();
    resultsEl.innerHTML = '';
    setStatus('');
    setProgress(null);
    updateUI();
  });

  pwdEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (state.mode === 'encrypt' && !confirmField.classList.contains('hidden')) {
      pwd2El.focus();
    } else {
      run();
    }
  });

  pwd2El.addEventListener('keydown', e => {
    if (e.key === 'Enter') run();
  });

  /* ================= 初始化 ================= */
  updateUI();
})();
</script>
</body>
</html>
