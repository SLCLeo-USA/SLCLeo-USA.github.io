*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{

  color:#f5f5f7;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* ── 语言切换器 ── */
.lang-switcher{
  position:fixed;
  top:20px;
  right:20px;
  z-index:100;
}
.lang-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  font-size:0.85rem;
  font-family:inherit;
  color:#d1d1d6;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:999px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:background 0.2s, border-color 0.2s, color 0.2s;
}
.lang-btn:hover{
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.2);
  color:#fff;
}
.lang-btn svg{
  width:12px;height:12px;
  transition:transform 0.2s;
}
.lang-switcher.open .lang-btn svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  min-width:170px;
  padding:6px;
  background:rgba(20,24,40,0.96);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px);
  transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}
.lang-switcher.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  display:block;
  width:100%;
  padding:10px 14px;
  font-size:0.9rem;
  font-family:inherit;
  color:#d1d1d6;
  background:transparent;
  border:none;
  border-radius:9px;
  text-align:left;
  cursor:pointer;
  transition:background 0.15s, color 0.15s;
}
.lang-menu button:hover{
  background:rgba(255,255,255,0.08);
  color:#fff;
}
.lang-menu button.active{
  color:#5ac8fa;
  background:rgba(90,200,250,0.1);
}

/* ── 容器 ── */
.container{
  position:relative;
  z-index:1;
  max-width:980px;
  margin:0 auto;
  padding:100px 24px 80px;
  text-align:center;
}

/* ── Hero ── */
.hero{margin-bottom:110px;}

h1{
  font-size:clamp(2.5rem,6vw,4rem);
  font-weight:500;
  letter-spacing:-0.02em;
  margin-bottom:16px;
  background:linear-gradient(135deg,#f5f5f7 0%,#9fc9ff 60%,#6ee7ff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  font-size:clamp(1rem,2vw,1.2rem);
  color:#8e8e93;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:0.02em;
  margin-bottom:44px;
}
.desc{
  font-size:1.1rem;
  color:#c7c7cc;
  line-height:1.75;
  margin-bottom:52px;
}
.btn-group{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  align-items:center;
}
.btn{
  font-size:1rem;
  font-family:inherit;
  padding:13px 28px;
  border-radius:999px;
  text-decoration:none;
  cursor:pointer;
  transition:background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  white-space:nowrap;
}
.btn-primary{
  background:#5ac8fa;
  color:#04121f;
  border:1px solid #5ac8fa;
  font-weight:500;
}
.btn-primary:hover{
  background:#7dd3fc;
  border-color:#7dd3fc;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(90,200,250,0.3);
}
.btn-outline{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.18);
  color:#e5e5ea;
}
.btn-outline:hover{
  background:rgba(255,255,255,0.09);
  border-color:rgba(255,255,255,0.3);
  transform:translateY(-2px);
}

/* ── 邮箱下拉 ── */
.email-wrap{position:relative;display:inline-block;}
.email-menu{
  position:absolute;
  top:calc(100% + 12px);
  left:50%;
  transform:translateX(-50%) translateY(-8px);
  min-width:290px;
  padding:8px;
  background:rgba(20,24,40,0.96);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  box-shadow:0 24px 64px rgba(0,0,0,0.6);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  opacity:0;
  visibility:hidden;
  transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  z-index:100;
}
.email-menu.open{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) translateY(0);
}
.email-option{
  display:block;
  padding:12px 16px;
  text-decoration:none;
  border-radius:11px;
  text-align:left;
  transition:background 0.15s;
}
.email-option:hover{
  background:rgba(90,200,250,0.1);
}
.email-role{
  display:block;
  font-size:0.95rem;
  color:#f5f5f7;
  font-weight:500;
  margin-bottom:3px;
}
.email-addr{

/* ── 区块标题 ── */
.section-title{

/* ── 卡片 ── */

.project-card:hover{

.project-card h3{

.project-card p{

/* ── 关于 ── */

/* ── 动画 ── */
@keyframes softFade{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}

.hero,

    min-width:min(290px,calc(100vw - 40px));

/* ══════════════════════════════════════════
   语言切换逻辑
   ══════════════════════════════════════════ */
(() => {
  "use strict";

  const STORAGE_KEY = "photaxis-lang";

  const switcher = document.getElementById("langSwitcher");
  const langBtn  = document.getElementById("langBtn");
  const langMenu = document.getElementById("langMenu");
  const currentLangEl = document.getElementById("currentLang");

  function detectLang() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && I18N[saved]) return saved;
    return "en"; // 默认英语
  }

  function applyLang(lang) {
    const t = I18N[lang] || I18N.en;

    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (t[key] !== undefined) el.innerHTML = t[key];
    });

    currentLangEl.textContent = t.langName;

    langMenu.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });

    localStorage.setItem(STORAGE_KEY, lang);
  }

  langBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = switcher.classList.toggle("open");
    langBtn.setAttribute("aria-expanded", String(open));
  });

  langMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (btn) {
      applyLang(btn.dataset.lang);
      switcher.classList.remove("open");
      langBtn.setAttribute("aria-expanded", "false");
    }
    e.stopPropagation();
  });

  document.addEventListener("click", () => {
    switcher.classList.remove("open");
    langBtn.setAttribute("aria-expanded", "false");
  });

  /* 初始化 */
  applyLang(detectLang());
})();

    emailMenu.classList.remove("open");
    emailBtn.setAttribute("aria-expanded", "false");
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      emailMenu.classList.remove("open");
      emailBtn.setAttribute("aria-expanded", "false");
    }
  });
})();
</script>
</body>
</html>
