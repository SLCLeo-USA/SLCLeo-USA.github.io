<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance — SLC.Leo</title>
<meta name="description" content="Website is under maintenance. Please come back later.">
<meta name="theme-color" content="#fbfbfd">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco","Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:#fbfbfd;
  color:#1d1d1f;
  min-height:100vh;
  padding:64px 24px 80px;
  transition:background 0.5s ease, color 0.5s ease;
}

/* ── 语言切换器 ── */
.lang-switcher{
  position:fixed;
  top:20px;
  right:20px;
  z-index:100;
}
.lang-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  font-size:0.85rem;
  font-family:inherit;
  color:#424245;
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(0,0,0,0.1);
  border-radius:999px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:background 0.2s, border-color 0.2s, color 0.2s;
}
.lang-btn:hover{
  background:rgba(255,255,255,0.95);
  border-color:rgba(0,0,0,0.18);
}
.lang-btn svg{
  width:12px;height:12px;
  transition:transform 0.2s;
}
.lang-switcher.open .lang-btn svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  min-width:150px;
  padding:6px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.08);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px);
  transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}
.lang-switcher.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  display:block;
  width:100%;
  padding:10px 14px;
  font-size:0.9rem;
  font-family:inherit;
  color:#424245;
  background:transparent;
  border:none;
  border-radius:9px;
  text-align:left;
  cursor:pointer;
  transition:background 0.15s, color 0.15s;
}
.lang-menu button:hover{
  background:rgba(0,122,255,0.08);
  color:#007aff;
}
.lang-menu button.active{
  color:#007aff;
  background:rgba(0,122,255,0.1);
}

/* ── 容器 ── */
.container{
  max-width:760px;
  margin:0 auto;
  text-align:center;
  position:relative;
}

/* ── 状态徽章 ── */
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-radius:999px;
  background:rgba(255,159,10,0.12);
  color:#c93400;
  font-size:0.88rem;
  font-weight:500;
  margin-bottom:32px;
}
.badge .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff9f0a;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.4;transform:scale(0.8);}
}

/* ── 标题与说明 ── */
h1{
  font-size:clamp(2rem,5vw,3rem);
  font-weight:500;
  letter-spacing:-0.02em;
  margin-bottom:18px;
  color:#1d1d1f;
}
.desc{
  font-size:1.1rem;
  color:#424245;
  line-height:1.8;
  margin-bottom:16px;
}
.desc-sub{
  font-size:0.95rem;
  color:#6e6e73;
  line-height:1.7;
  margin-bottom:52px;
}

/* ── 按钮 ── */
.btn-group{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:72px;
}
.btn{
  font-size:1rem;
  font-family:inherit;
  padding:13px 26px;
  border-radius:999px;
  text-decoration:none;
  cursor:pointer;
  border:1px solid transparent;
  transition:background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  white-space:nowrap;
}
.btn-primary{
  background:#007aff;
  color:#fff;
  border-color:#007aff;
}
.btn-primary:hover{
  background:#0077ed;
  border-color:#0077ed;
}
.btn-outline{
  background:transparent;
  border-color:#007aff;
  color:#007aff;
}
.btn-outline:hover{
  background:rgba(0,122,255,0.08);
}

/* ── 跳转卡片 ── */
.redirect-card{
  display:block;
  text-align:left;
  padding:36px 40px;
  border-radius:20px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.06);
  text-decoration:none;
  transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.redirect-card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 40px rgba(0,0,0,0.08);
}
.redirect-card .card-label{
  font-size:0.8rem;
  font-weight:500;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:#86868b;
  margin-bottom:14px;
}
.redirect-card h3{
  font-size:1.5rem;
  font-weight:500;
  margin-bottom:12px;
  color:#1d1d1f;
}
.redirect-card p{
  color:#424245;
  line-height:1.7;
  margin-bottom:22px;
}
.redirect-card .card-link{
  color:#007aff;
  font-size:1rem;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:gap 0.2s ease;
}
.redirect-card:hover .card-link{
  gap:10px;
  text-decoration:underline;
}

/* ── 移动端 ── */
@media (max-width:640px){
  body{padding:32px 16px 56px;}
  .lang-switcher{top:14px;right:14px;}
  .lang-btn{padding:7px 12px;font-size:0.8rem;}
  .lang-menu{min-width:130px;}
  .badge{margin-bottom:24px;}
  .desc-sub{margin-bottom:40px;}
  .btn-group{flex-direction:column;gap:12px;margin-bottom:48px;}
  .btn{width:100%;text-align:center;}
  .redirect-card{padding:26px 24px;border-radius:16px;}
}

/* ── 深色模式 ── */
@media (prefers-color-scheme: dark){
  body{background:#121214;color:#f5f5f7;}
  h1{color:#f5f5f7;}
  .desc{color:#d1d1d6;}
  .desc-sub{color:#a1a1a6;}
  .badge{background:rgba(255,159,10,0.16);color:#ffb340;}
  .btn-primary{background:#2997ff;border-color:#2997ff;color:#04121f;}
  .btn-primary:hover{background:#349cff;border-color:#349cff;}
  .btn-outline{border-color:#2997ff;color:#2997ff;}
  .btn-outline:hover{background:rgba(41,151,255,0.1);}
  .redirect-card{background:#1e1e22;border-color:rgba(255,255,255,0.08);}
  .redirect-card:hover{box-shadow:0 12px 40px rgba(0,0,0,0.3);}
  .redirect-card .card-label{color:#86868b;}
  .redirect-card h3{color:#f5f5f7;}
  .redirect-card p{color:#d1d1d6;}
  .redirect-card .card-link{color:#2997ff;}
  .lang-btn{color:#d1d1d6;background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12);}
  .lang-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);}
  .lang-menu{background:#1e1e22;border-color:rgba(255,255,255,0.08);box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .lang-menu button{color:#d1d1d6;}
  .lang-menu button:hover{background:rgba(41,151,255,0.12);color:#2997ff;}
  .lang-menu button.active{color:#2997ff;background:rgba(41,151,255,0.12);}
}

/* ── 减少动画 ── */
@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- 语言切换 -->
<div class="lang-switcher" id="langSwitcher">
  <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
    <span id="currentLang">English</span>
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4.5 6 7.5 9 4.5"/>
    </svg>
  </button>
  <div class="lang-menu" id="langMenu" role="menu">
    <button type="button" data-lang="en"    role="menuitem">English</button>
    <button type="button" data-lang="zh-CN" role="menuitem">中文</button>
    <button type="button" data-lang="fr"    role="menuitem">Français</button>
  </div>
</div>

<div class="container">

  <div class="badge">
    <span class="dot"></span>
    <span data-i18n="badge"></span>
  </div>

  <h1 data-i18n="title"></h1>
  <p class="desc" data-i18n="desc"></p>
  <p class="desc-sub" data-i18n="descSub"></p>

  <div class="btn-group">
    <button class="btn btn-primary" id="refresh-btn" data-i18n="refreshBtn"></button>
    <a class="btn btn-outline" href="mailto:godsunwyyx123spx@163.com" data-i18n="contactBtn"></a>
  </div>

  <!-- 跳转卡片 -->
  <a class="redirect-card" href="https://photaxis-lab.github.io/">
    <div class="card-label" data-i18n="cardLabel"></div>
    <h3 data-i18n="cardTitle"></h3>
    <p data-i18n="cardDesc"></p>
    <span class="card-link" data-i18n="cardLink"></span>
  </a>

</div>

<script>
/* ══════════════════════════════════════════
   多语言文案
   ══════════════════════════════════════════ */
const I18N = {

  "en": {
    langName: "English",
    badge: "Under Maintenance",
    title: "We're fixing a major issue",
    desc: "The site is currently under emergency maintenance.",
    descSub: "Service should be back shortly. In the meantime, you can visit our other site.",
    refreshBtn: "Refresh",
    contactBtn: "Contact Us",
    cardLabel: "Meanwhile",
    cardTitle: "Photaxis Lab",
    cardDesc: "While we fix things here, feel free to explore our other site. You will find projects, notes and experiments there.",
    cardLink: "Visit Photaxis Lab →"
  },

  "zh-CN": {
    langName: "中文",
    badge: "维护中",
    title: "网站正在抢修",
    desc: "我们遇到了一个比较严重的问题，工程师正在紧急处理。",
    descSub: "服务预计很快恢复。在此期间，您可以先访问我们的另一个站点。",
    refreshBtn: "刷新页面",
    contactBtn: "联系我们",
    cardLabel: "在此期间",
    cardTitle: "Photaxis Lab",
    cardDesc: "在我们修复期间，欢迎先逛逛我们的另一个站点。那里有项目、笔记和实验。",
    cardLink: "访问 Photaxis Lab →"
  },

  "fr": {
    langName: "Français",
    badge: "Maintenance en cours",
    title: "Nous réparons un problème majeur",
    desc: "Le site est actuellement en maintenance d'urgence.",
    descSub: "Le service devrait revenir rapidement. En attendant, vous pouvez visiter notre autre site.",
    refreshBtn: "Actualiser",
    contactBtn: "Nous contacter",
    cardLabel: "En attendant",
    cardTitle: "Photaxis Lab",
    cardDesc: "Pendant que nous réparons, n'hésitez pas à explorer notre autre site. Vous y trouverez des projets, des notes et des expérimentations.",
    cardLink: "Visiter Photaxis Lab →"
  }
};


/* ══════════════════════════════════════════
   语言切换逻辑
   ══════════════════════════════════════════ */
(() => {
  "use strict";

  const STORAGE_KEY = "slcleo-lang";

  const switcher = document.getElementById("langSwitcher");
  const langBtn  = document.getElementById("langBtn");
  const langMenu = document.getElementById("langMenu");
  const currentLangEl = document.getElementById("currentLang");

  function detectLang() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && I18N[saved]) return saved;
    return "en";
  }

  function applyLang(lang) {
    const t = I18N[lang] || I18N.en;

    document.documentElement.lang = lang;
    document.title = (lang === "zh-CN" ? "维护中" : "Maintenance") + " — SLC.Leo";

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (t[key] !== undefined) el.textContent = t[key];
    });

    currentLangEl.textContent = t.langName;

    langMenu.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });

    localStorage.setItem(STORAGE_KEY, lang);
  }

  langBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = switcher.classList.toggle("open");
    langBtn.setAttribute("aria-expanded", String(open));
  });

  langMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (btn) {
      applyLang(btn.dataset.lang);
      switcher.classList.remove("open");
      langBtn.setAttribute("aria-expanded", "false");
    }
    e.stopPropagation();
  });

  document.addEventListener("click", () => {
    switcher.classList.remove("open");
    langBtn.setAttribute("aria-expanded", "false");
  });

  applyLang(detectLang());
})();

/* ── 刷新按钮 ── */
document.getElementById('refresh-btn').addEventListener('click', () => {
  location.reload();
});
</script>
</body>
</html>
