<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>维护中 — SLC.Leo</title>
<meta name="description" content="网站正在维护，请稍后再来。">
<meta name="theme-color" content="#fbfbfd">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco","Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:#fbfbfd;
  color:#1d1d1f;
  min-height:100vh;
  padding:64px 24px 80px;
  transition:background 0.5s ease, color 0.5s ease;
}

.container{
  max-width:760px;
  margin:0 auto;
  text-align:center;
  position:relative;
}

/* ── 状态徽章 ── */
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-radius:999px;
  background:rgba(255,159,10,0.12);
  color:#c93400;
  font-size:0.88rem;
  font-weight:500;
  margin-bottom:32px;
}
.badge .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff9f0a;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.4;transform:scale(0.8);}
}

/* ── 标题与说明 ── */
h1{
  font-size:clamp(2rem,5vw,3rem);
  font-weight:500;
  letter-spacing:-0.02em;
  margin-bottom:18px;
  color:#1d1d1f;
}
.desc{
  font-size:1.1rem;
  color:#424245;
  line-height:1.8;
  margin-bottom:16px;
}
.desc-sub{
  font-size:0.95rem;
  color:#6e6e73;
  line-height:1.7;
  margin-bottom:52px;
}

/* ── 按钮 ── */
.btn-group{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:80px;
}
.btn{
  font-size:1rem;
  font-family:inherit;
  padding:13px 26px;
  border-radius:999px;
  text-decoration:none;
  cursor:pointer;
  border:1px solid transparent;
  transition:background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  white-space:nowrap;
}
.btn-primary{
  background:#007aff;
  color:#fff;
  border-color:#007aff;
}
.btn-primary:hover{
  background:#0077ed;
  border-color:#0077ed;
}
.btn-outline{
  background:transparent;
  border-color:#007aff;
  color:#007aff;
}
.btn-outline:hover{
  background:rgba(0,122,255,0.08);
}

/* ── 游戏区 ── */
.game-section{
  text-align:left;
  padding:36px;
  border-radius:20px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.06);
  transition:box-shadow 0.3s ease;
}
.game-section:hover{
  box-shadow:0 12px 40px rgba(0,0,0,0.06);
}
.game-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.game-title{
  font-size:1.3rem;
  font-weight:500;
  color:#1d1d1f;
  display:flex;
  align-items:center;
  gap:10px;
}
.game-title i{
  color:#007aff;
  font-size:1.1rem;
}
.game-stats{
  display:flex;
  gap:20px;
  font-size:0.9rem;
  color:#6e6e73;
}
.game-stats strong{
  color:#1d1d1f;
  font-weight:500;
}
.game-hint{
  font-size:0.88rem;
  color:#6e6e73;
  line-height:1.65;
  margin-bottom:20px;
}

/* ── 游戏画布 ── */
.canvas-wrap{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:#f5f5f7;
  border:1px solid rgba(0,0,0,0.06);
  touch-action:none;
}
#game-canvas{
  display:block;
  width:100%;
  height:auto;
  cursor:pointer;
}

/* ── 开始/结束遮罩 ── */
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:rgba(251,251,253,0.92);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  text-align:center;
  padding:24px;
  transition:opacity 0.3s ease, visibility 0.3s ease;
}
.overlay.hidden{
  opacity:0;
  visibility:hidden;
}
.overlay-title{
  font-size:1.2rem;
  font-weight:500;
  color:#1d1d1f;
}
.overlay-text{
  font-size:0.95rem;
  color:#6e6e73;
  line-height:1.7;
  max-width:340px;
}
.overlay button{
  margin-top:6px;
}

/* ── 移动端 ── */
@media (max-width:640px){
  body{padding:32px 16px 56px;}
  .badge{margin-bottom:24px;}
  .desc-sub{margin-bottom:40px;}
  .btn-group{flex-direction:column;gap:12px;margin-bottom:56px;}
  .btn{width:100%;text-align:center;}
  .game-section{padding:22px;border-radius:16px;}
  .game-header{flex-direction:column;align-items:flex-start;}
  .game-stats{font-size:0.85rem;}
}

/* ── 深色模式 ── */
@media (prefers-color-scheme: dark){
  body{background:#121214;color:#f5f5f7;}
  h1{color:#f5f5f7;}
  .desc{color:#d1d1d6;}
  .desc-sub{color:#a1a1a6;}
  .badge{background:rgba(255,159,10,0.16);color:#ffb340;}
  .btn-primary{background:#2997ff;border-color:#2997ff;color:#04121f;}
  .btn-primary:hover{background:#349cff;border-color:#349cff;}
  .btn-outline{border-color:#2997ff;color:#2997ff;}
  .btn-outline:hover{background:rgba(41,151,255,0.1);}
  .game-section{background:#1e1e22;border-color:rgba(255,255,255,0.08);}
  .game-section:hover{box-shadow:0 12px 40px rgba(0,0,0,0.3);}
  .game-title{color:#f5f5f7;}
  .game-title i{color:#2997ff;}
  .game-stats{color:#a1a1a6;}
  .game-stats strong{color:#f5f5f7;}
  .game-hint{color:#a1a1a6;}
  .canvas-wrap{background:#0a0a0c;border-color:rgba(255,255,255,0.08);}
  .overlay{background:rgba(18,18,20,0.92);}
  .overlay-title{color:#f5f5f7;}
  .overlay-text{color:#a1a1a6;}
}

/* ── 减少动画 ── */
@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="container">

  <div class="badge">
    <span class="dot"></span>
    <span>维护中</span>
  </div>

  <h1>网站正在抢修</h1>
  <p class="desc">我们遇到了一个比较严重的问题，工程师正在紧急处理。</p>
  <p class="desc-sub">服务预计很快恢复。在此期间，您可以先玩个小游戏打发时间。</p>

  <div class="btn-group">
    <button class="btn btn-primary" id="refresh-btn">刷新页面</button>
    <a class="btn btn-outline" href="mailto:godsunwyyx123spx@163.com">联系我们</a>
  </div>

  <!-- 游戏 -->
  <section class="game-section">
    <div class="game-header">
      <div class="game-title">
        <i class="fa-solid fa-gamepad"></i>
        <span>星尘收集者</span>
      </div>
      <div class="game-stats">
        <span>得分 <strong id="score">0</strong></span>
        <span>最高 <strong id="best">0</strong></span>
      </div>
    </div>

    <p class="game-hint">用鼠标或手指控制飞船，接住下落的星星。接到星星得 1 分，漏掉 3 颗星星游戏结束。</p>

    <div class="canvas-wrap">
      <canvas id="game-canvas" width="720" height="420"></canvas>

      <div class="overlay" id="start-overlay">
        <div class="overlay-title">准备好了吗？</div>
        <div class="overlay-text">点击开始，用飞船接住星星。</div>
        <button class="btn btn-primary" id="start-btn">开始游戏</button>
      </div>

      <div class="overlay hidden" id="over-overlay">
        <div class="overlay-title">游戏结束</div>
        <div class="overlay-text">你的得分是 <strong id="final-score">0</strong>。</div>
        <button class="btn btn-primary" id="restart-btn">再来一局</button>
      </div>
    </div>
  </section>

</div>

<script>
/* ══════════════════════════════════════════
   星尘收集者
   ══════════════════════════════════════════ */
(() => {
  "use strict";

  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');

  const scoreEl       = document.getElementById('score');
  const bestEl        = document.getElementById('best');
  const finalScoreEl  = document.getElementById('final-score');
  const startOverlay  = document.getElementById('start-overlay');
  const overOverlay   = document.getElementById('over-overlay');
  const startBtn      = document.getElementById('start-btn');
  const restartBtn    = document.getElementById('restart-btn');

  const W = canvas.width;
  const H = canvas.height;

  let running = false;
  let score = 0;
  let missed = 0;
  let best = parseInt(localStorage.getItem('slcleo-game-best') || '0', 10);
  bestEl.textContent = best;

  let ship, stars, particles, lastTime, spawnTimer, animationId;

  /* ── 主题色（跟随深浅色） ── */
  function isDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function theme() {
    return isDark()
      ? { bg:'#0a0a0c', ship:'#2997ff', shipGlow:'rgba(41,151,255,0.35)', star:'#ffd60a', starGlow:'rgba(255,214,10,0.3)', text:'#f5f5f7', sub:'#a1a1a6' }
      : { bg:'#f5f5f7', ship:'#007aff', shipGlow:'rgba(0,122,255,0.25)', star:'#ff9f0a', starGlow:'rgba(255,159,10,0.25)', text:'#1d1d1f', sub:'#6e6e73' };
  }

  /* ── 初始化 ── */
  function reset() {
    ship = {
      x: W / 2,
      y: H - 50,
      w: 72,
      h: 20,
      speed: 0,
      targetX: W / 2
    };
    stars = [];
    particles = [];
    score = 0;
    missed = 0;
    spawnTimer = 0;
    scoreEl.textContent = '0';
    draw();
  }

  /* ── 输入 ── */
  function moveTo(x) {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    ship.targetX = (x - rect.left) * scale;
  }

  canvas.addEventListener('mousemove', (e) => moveTo(e.clientX));
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    moveTo(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchstart', (e) => {
    moveTo(e.touches[0].clientX);
  }, { passive: true });

  /* ── 游戏循环 ── */
  function spawnStar() {
    stars.push({
      x: 40 + Math.random() * (W - 80),
      y: -20,
      r: 10 + Math.random() * 4,
      vy: 1.6 + Math.random() * 1.4,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.08
    });
  }

  function addParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1,
        color
      });
    }
  }

  function update(dt) {
    /* 飞船平滑移动 */
    ship.x += (ship.targetX - ship.x) * 0.18;
    ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));

    /* 生成星星 */
    spawnTimer += dt;
    if (spawnTimer > 40) {
      spawnTimer = 0;
      spawnStar();
    }

    /* 星星下落 */
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.vy * dt;
      s.rot += s.rotSpeed * dt;

      /* 碰撞检测 */
      const dx = Math.abs(s.x - ship.x);
      const dy = Math.abs(s.y - ship.y);
      if (dx < ship.w / 2 && dy < ship.h / 2 + s.r) {
        score++;
        scoreEl.textContent = score;
        addParticles(s.x, s.y, theme().star);
        stars.splice(i, 1);
        continue;
      }

      /* 漏掉 */
      if (s.y > H + 30) {
        stars.splice(i, 1);
        missed++;
        if (missed >= 3) {
          gameOver();
          return;
        }
      }
    }

    /* 粒子 */
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.08 * dt;
      p.life -= 0.03 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawStar(s, color) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const outer = s.r;
      const inner = s.r * 0.45;
      const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      const x1 = Math.cos(angle) * outer;
      const y1 = Math.sin(angle) * outer;
      const x2 = Math.cos(angle + Math.PI / 5) * inner;
      const y2 = Math.sin(angle + Math.PI / 5) * inner;
      if (i === 0) ctx.moveTo(x1, y1);
      else ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    const t = theme();

    /* 背景 */
    ctx.fillStyle = t.bg;
    ctx.fillRect(0, 0, W, H);

    /* 顶部漏掉计数 */
    ctx.font = '500 16px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = t.sub;
    ctx.textAlign = 'right';
    ctx.fillText('漏掉 ' + missed + ' / 3', W - 24, 34);

    /* 粒子 */
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 星星 */
    for (const s of stars) {
      ctx.shadowColor = t.starGlow;
      ctx.shadowBlur = 12;
      drawStar(s, t.star);
      ctx.shadowBlur = 0;
    }

    /* 飞船 */
    ctx.shadowColor = t.shipGlow;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    const sx = ship.x;
    const sy = ship.y;
    const sw = ship.w / 2;
    const sh = ship.h / 2;
    ctx.moveTo(sx, sy - sh - 6);
    ctx.lineTo(sx + sw, sy + sh);
    ctx.lineTo(sx - sw, sy + sh);
    ctx.closePath();
    ctx.fillStyle = t.ship;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min((now - lastTime) / 16.667, 3);
    lastTime = now;

    update(dt);
    draw();

    animationId = requestAnimationFrame(loop);
  }

  function start() {
    reset();
    running = true;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    lastTime = performance.now();
    animationId = requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(animationId);

    if (score > best) {
      best = score;
      localStorage.setItem('slcleo-game-best', String(best));
      bestEl.textContent = best;
    }

    finalScoreEl.textContent = score;
    overOverlay.classList.remove('hidden');
  }

  /* ── 按钮 ── */
  startBtn.addEventListener('click', start);
  restartBtn.addEventListener('click', start);

  /* ── 监听系统主题变化 ── */
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!running) draw();
    });
  }

  /* ── 初始绘制 ── */
  reset();
})();

/* ── 刷新按钮 ── */
document.getElementById('refresh-btn').addEventListener('click', () => {
  location.reload();
});
</script>

<!-- Font Awesome（图标） -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</body>
</html>
